<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a11">
  <title>KOBI / FIRST CUT</title>
  <style>
    :root {
      --ink:#090c0a; --panel:#101711; --panel-2:#151d14; --line:#40513b;
      --cream:#e8eadc; --muted:#94a08e; --green:#b6df68; --amber:#f0bd58;
      --rose:#e47675; --cyan:#78cfc5; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--cream); background:radial-gradient(900px 530px at 80% -10%,#243528 0%,transparent 66%),var(--ink); font-family:var(--mono); }
    button { font:inherit; }
    button:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
    .shell { width:min(1160px,calc(100% - 32px)); margin:0 auto; padding:24px 0 38px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 0 15px; border-bottom:1px solid var(--line); }
    .brand { color:var(--green); font-weight:900; font-size:clamp(1rem,2.3vw,1.3rem); letter-spacing:.12em; }
    .brand b { color:var(--amber); }
    .turn { display:flex; align-items:baseline; gap:10px; text-align:left; }
    .turn span { color:var(--muted); font-size:.72rem; letter-spacing:.08em; }
    .turn strong { color:var(--amber); font-size:1.28rem; }
    .headline { display:flex; align-items:end; justify-content:space-between; gap:16px; padding:24px 0 18px; }
    .eyebrow { margin:0 0 7px; color:var(--green); font-size:.72rem; font-weight:900; letter-spacing:.1em; }
    h1 { margin:0; font-size:clamp(1.75rem,4vw,3.1rem); letter-spacing:-.075em; line-height:.95; }
    .headline p { max-width:37ch; margin:0; color:var(--muted); font-size:.8rem; line-height:1.55; text-align:left; }
    .command { display:grid; grid-template-columns:1.15fr .85fr; gap:12px; margin-bottom:12px; }
    .panel { position:relative; overflow:hidden; border:1px solid var(--line); background:linear-gradient(145deg,rgba(21,29,20,.96),rgba(9,12,10,.96)); box-shadow:0 14px 35px rgba(0,0,0,.2); }
    .panel::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.18; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(182,223,104,.08) 4px); }
    .mission { display:flex; align-items:center; gap:13px; min-height:96px; padding:16px; }
    .mission-mark { display:grid; place-items:center; flex:0 0 34px; width:34px; height:34px; color:var(--ink); background:var(--amber); font-weight:900; transform:rotate(45deg); }
    .mission-mark b { transform:rotate(-45deg); }
    .mission span,.finance label,.market-kicker { color:var(--muted); font-size:.67rem; font-weight:800; letter-spacing:.09em; }
    .mission strong { display:block; margin-top:3px; color:var(--cream); font-size:1rem; }
    .mission p { margin:3px 0 0; color:var(--muted); font-size:.76rem; line-height:1.4; }
    .finance { display:grid; grid-template-columns:repeat(3,1fr); min-height:96px; }
    .finance div { display:grid; align-content:center; gap:5px; padding:12px 14px; border-inline-start:1px solid var(--line); }
    .finance div:first-child { border:0; }
    .finance b { direction:ltr; color:var(--cream); font-size:1rem; }
    .finance .debt b { color:var(--rose); }
    .finance .slots b { color:var(--cyan); }
    .grid { display:grid; grid-template-columns:minmax(0,1fr) 278px; gap:12px; }
    .market { min-height:470px; padding:18px; }
    .market-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .market-head h2 { margin:4px 0 0; color:var(--cream); font-size:1.35rem; }
    .market-head p { margin:0; color:var(--muted); font-size:.72rem; text-align:left; }
    .goods { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .good { display:grid; grid-template-columns:1fr auto; gap:9px; padding:12px; border:1px solid rgba(148,160,142,.26); background:rgba(255,255,255,.018); }
    .good:hover { border-color:var(--green); }
    .good-top { display:flex; align-items:start; justify-content:space-between; gap:8px; }
    .good-title { color:var(--cream); font-weight:900; font-size:.89rem; }
    .good-owned { color:var(--cyan); font-size:.68rem; white-space:nowrap; }
    .good-note { margin:5px 0 0; color:var(--muted); font-size:.68rem; line-height:1.35; }
    .price { direction:ltr; align-self:center; color:var(--amber); font-weight:900; font-size:1.08rem; }
    .deal-actions { display:flex; gap:5px; grid-column:1/-1; }
    .deal-actions button,.travel button,.debt-control button,.footer-actions button,.event button { min-height:31px; padding:6px 9px; cursor:pointer; color:var(--cream); background:#192119; border:1px solid var(--line); font-size:.72rem; font-weight:800; }
    .deal-actions button:hover,.travel button:hover,.debt-control button:hover,.footer-actions button:hover,.event button:hover { color:var(--ink); background:var(--green); border-color:var(--green); }
    .deal-actions button:disabled { cursor:not-allowed; opacity:.36; }
    .deal-actions .sell { color:var(--amber); }
    .deal-actions .sell:hover { background:var(--amber); border-color:var(--amber); }
    .rail { display:grid; align-content:start; gap:12px; }
    .rail .panel { padding:15px; }
    .rail h2 { margin:0 0 12px; color:var(--cream); font-size:.95rem; }
    .travel { display:grid; gap:6px; }
    .travel button { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:right; }
    .travel button.current { cursor:default; color:var(--green); border-color:var(--green); background:rgba(182,223,104,.08); }
    .travel button.current:hover { color:var(--green); background:rgba(182,223,104,.08); }
    .travel small { color:var(--muted); font-size:.63rem; }
    .bag { display:grid; gap:7px; }
    .bag-row { display:flex; justify-content:space-between; gap:9px; padding-bottom:7px; color:var(--muted); font-size:.73rem; border-bottom:1px dashed rgba(148,160,142,.25); }
    .bag-row b { color:var(--cream); }
    .bag-empty { margin:0; color:var(--muted); font-size:.74rem; line-height:1.5; }
    .debt-control { display:grid; gap:8px; }
    .debt-control p { margin:0; color:var(--muted); font-size:.7rem; line-height:1.45; }
    .debt-control button { color:var(--rose); }
    .debt-control button:hover { background:var(--rose); border-color:var(--rose); }
    .log { display:grid; gap:6px; max-height:160px; overflow:auto; }
    .log p { margin:0; color:var(--muted); font-size:.68rem; line-height:1.42; }
    .log p:first-child { color:var(--cream); }
    .footer-actions { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    .footer-actions button:last-child { color:var(--muted); }
    .modal { position:fixed; z-index:5; inset:0; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.68); }
    .modal.hidden { display:none; }
    .event { width:min(470px,100%); padding:20px; border:1px solid var(--amber); background:linear-gradient(145deg,#1d261d,#0a0e0b); box-shadow:0 30px 80px rgba(0,0,0,.65); }
    .event span { color:var(--amber); font-size:.69rem; font-weight:900; letter-spacing:.1em; }
    .event h2 { margin:8px 0 0; font-size:1.55rem; }
    .event p { margin:8px 0 18px; color:var(--muted); font-size:.83rem; line-height:1.55; }
    .event b { color:var(--green); }
    .end-score { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
    .end-score div { padding:9px; background:rgba(255,255,255,.04); }
    .end-score span { display:block; color:var(--muted); font-size:.64rem; }
    .end-score b { display:block; margin-top:4px; color:var(--cream); font-size:.9rem; }
    @media (max-width:780px) { .command,.grid { grid-template-columns:1fr; } .headline { align-items:start; display:grid; } .headline p { text-align:right; } .rail { grid-template-columns:repeat(2,minmax(0,1fr)); } .rail .log-panel { grid-column:1/-1; } }
    @media (max-width:520px) { .shell { width:min(100% - 20px,1160px); padding-top:14px; } .goods,.rail { grid-template-columns:1fr; } .rail .log-panel { grid-column:auto; } .finance { min-height:72px; } .finance div { padding:9px; } .mission { min-height:76px; } .market { padding:12px; } .topbar { align-items:start; } }
    /* Film-school skin: the economic loop stays terse, but its visual system
       now belongs to KOBI / LIFE rather than a green DOS terminal. */
    :root { --ink:#070a11; --panel:#121928; --panel-2:#1a2336; --line:#303b50; --cream:#f7f2e8; --muted:#9aa3b4; --green:#67cfc4; --amber:#f4bd4b; --rose:#e28c83; --cyan:#93b6e0; }
    body { background:radial-gradient(820px 520px at 12% 0%,rgba(72,57,158,.25),transparent 66%),radial-gradient(650px 420px at 95% 4%,rgba(36,117,137,.15),transparent 66%),var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    .shell { width:min(1240px,calc(100% - 42px)); padding-top:30px; }
    .topbar { padding-bottom:17px; border-color:rgba(229,238,255,.15); }
    .brand { color:var(--amber); font-family:var(--mono); letter-spacing:.14em; }
    .brand b { color:var(--cream); }
    .turn strong { color:var(--cream); }
    .headline { padding:31px 0 20px; }
    .eyebrow { color:var(--amber); }
    h1 { letter-spacing:-.06em; }
    .panel { border-color:rgba(229,238,255,.15); border-radius:15px; background:linear-gradient(145deg,rgba(29,37,57,.96),rgba(13,18,29,.98)); box-shadow:0 20px 50px rgba(0,0,0,.23); }
    .panel::before { opacity:1; background:radial-gradient(420px 170px at 100% 0%,rgba(125,110,204,.1),transparent 70%); }
    .mission { min-height:104px; }
    .mission-mark { color:#18130a; background:var(--amber); border-radius:8px; transform:none; }
    .mission-mark b { transform:none; }
    .mission span,.finance label,.market-kicker { color:var(--amber); }
    .finance { grid-template-columns:repeat(4,1fr); }
    .finance div { border-color:rgba(229,238,255,.11); }
    .finance .slots b { color:var(--cyan); }
    .finance .fame b { color:var(--green); }
    .market { padding:21px; }
    .market-head { border-color:rgba(229,238,255,.12); }
    .good { border-color:rgba(229,238,255,.13); border-radius:10px; background:rgba(255,255,255,.028); }
    .good:hover { border-color:var(--amber); background:rgba(244,185,66,.06); }
    .good-owned { color:var(--cyan); }
    .deal-actions button,.travel button,.debt-control button,.footer-actions button,.event button { border-color:rgba(229,238,255,.16); border-radius:7px; background:rgba(255,255,255,.045); }
    .deal-actions button:hover,.travel button:hover,.debt-control button:hover,.footer-actions button:hover,.event button:hover { color:#191308; background:var(--amber); border-color:var(--amber); }
    .deal-actions .sell { color:var(--cyan); }
    .deal-actions .sell:hover { background:var(--cyan); border-color:var(--cyan); color:#071014; }
    .travel button.current { color:var(--amber); border-color:var(--amber); background:rgba(244,185,66,.08); }
    .travel button.current:hover { color:var(--amber); background:rgba(244,185,66,.08); }
    .bag-row { border-color:rgba(229,238,255,.14); }
    .debt-control button { color:var(--rose); }
    .debt-control button:hover { color:#230b0b; background:var(--rose); border-color:var(--rose); }
    .event { border-color:rgba(244,185,66,.65); border-radius:16px; background:linear-gradient(145deg,#1b2438,#101621); }
    .event b { color:var(--green); }
    .end-score div { border-radius:8px; background:rgba(255,255,255,.055); }
    .price-wrap { display:grid; align-content:center; justify-items:end; gap:4px; }
    .market-move { font-size:.63rem; font-weight:800; white-space:nowrap; }
    .market-move.up { color:var(--rose); }
    .market-move.down { color:var(--green); }
    .market-move.steady { color:var(--muted); }
    .production { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:16px; margin-bottom:12px; padding:15px 18px; }
    .production-kicker { color:var(--amber); font-size:.68rem; font-weight:900; letter-spacing:.09em; }
    .production h2 { margin:4px 0 0; font-size:1.13rem; }
    .production p { margin:4px 0 0; color:var(--muted); font-size:.75rem; line-height:1.4; }
    .film-requirements { display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
    .film-requirements span { padding:4px 7px; color:var(--muted); border:1px solid rgba(229,238,255,.13); border-radius:999px; font-size:.66rem; }
    .film-requirements span.ready { color:#0b1718; border-color:var(--green); background:var(--green); }
    .production button { min-height:42px; padding:9px 13px; cursor:pointer; color:#21180a; border:0; border-radius:8px; background:var(--amber); font-weight:900; white-space:nowrap; }
    .production button:disabled { cursor:not-allowed; opacity:.38; }
    .production button:not(:disabled):hover { transform:translateY(-1px); box-shadow:0 8px 20px rgba(244,185,66,.18); }
    @media (max-width:700px) { .production { grid-template-columns:1fr; } .production button { width:100%; } }
    @media (max-width:520px) { .shell { width:min(100% - 24px,1240px); } .finance { grid-template-columns:repeat(2,1fr); } .finance div:nth-child(3) { border-inline-start:0; } }
  </style>
</head>
<body>
  <div id="app"></div>
  <div class="modal hidden" id="modal"></div>
  <script>
    (() => {
      const GOODS = [
        { id:"script", name:"תסריט קצר", note:"חומר הגלם של הסרט הראשון", base:115, fame:1 },
        { id:"set", name:"יום סט", note:"צוות, לוקיישן ויום צילום אחד", base:245, fame:2 },
        { id:"camera", name:"מצלמה משומשת", note:"נשארת בתיק ומאפשרת לצלם", base:390, fame:3 },
        { id:"sound", name:"ערכת סאונד", note:"נשארת בתיק ומונעת סרט אילם", base:260, fame:2 },
        { id:"lights", name:"ערכת תאורה", note:"לא חובה, אבל הסרט נראה אחרת", base:205, fame:2 },
        { id:"edit", name:"עמדת עריכה ניידת", note:"לא חובה, אבל מעלה את איכות הסרט", base:330, fame:3 },
        { id:"festival", name:"הגשה לפסטיבל", note:"הסיכון הכי יקר בדרך לשם", base:520, fame:5 }
      ];
      const CITIES = [
        { id:"tlv", name:"תל אביב", zone:"לימודים והפקות", fare:0, mods:{ script:.82, set:1.15, camera:1.06, sound:1.17, lights:1.1, edit:1.12, festival:1.08 } },
        { id:"jerusalem", name:"ירושלים", zone:"מוסדות ופיצ׳ינג", fare:90, mods:{ script:1.1, set:1.08, camera:1.16, sound:1.03, lights:1.14, edit:.88, festival:1.28 } },
        { id:"haifa", name:"חיפה", zone:"ציוד וחדרי עריכה", fare:110, mods:{ script:1.08, set:.86, camera:.79, sound:.82, lights:.88, edit:.76, festival:1.1 } },
        { id:"athens", name:"אתונה", zone:"פסטיבלים וקו־פרודוקציה", fare:260, mods:{ script:1.22, set:1.18, camera:.92, sound:1.06, lights:1.02, edit:1.02, festival:.68 } }
      ];
      const STORAGE_KEY = "kobi-first-cut-v3";
      const app = typeof document !== "undefined" ? document.getElementById("app") : null;
      const modal = typeof document !== "undefined" ? document.getElementById("modal") : null;
      const money = (n) => new Intl.NumberFormat("he-IL", { style:"currency", currency:"ILS", maximumFractionDigits:0 }).format(Math.round(n));
      const clone = (value) => JSON.parse(JSON.stringify(value));
      const totalBag = () => Object.values(state.bag).reduce((sum, qty) => sum + qty, 0);
      const city = () => CITIES.find((entry) => entry.id === state.city) || CITIES[0];
      const item = (id) => GOODS.find((entry) => entry.id === id);
      const randomInt = (min, max) => Math.floor(Math.random() * (max - min + 1)) + min;
      function createState() {
        const next = { day:1, maxDays:30, city:"tlv", cash:1500, debt:8000, fame:0, followers:0, films:0, capacity:10, bag:{}, prices:{}, previousPrices:{}, log:[], event:null, ended:false };
        next.prices = generatePrices(next.city);
        next.previousPrices = { ...next.prices };
        next.log = ["שבוע 1: סטודנט/ית לקולנוע עם חוב, תיק ריק וסרט ראשון בראש."];
        return next;
      }
      let state = createState();
      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && saved.prices && !saved.ended) {
            const fresh = createState();
            state = { ...fresh, ...saved, films:Number(saved.films)||0, prices:{ ...fresh.prices, ...saved.prices }, previousPrices:saved.previousPrices || fresh.prices, event:null };
          }
        } catch (_) {}
      }
      function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }
      function generatePrices(cityId) {
        const destination = CITIES.find((entry) => entry.id === cityId) || CITIES[0];
        const result = {};
        GOODS.forEach((good) => {
          const wave = .7 + Math.random() * .72;
          result[good.id] = Math.max(25, Math.round(good.base * destination.mods[good.id] * wave / 5) * 5);
        });
        return result;
      }
      function addLog(message) { state.log.unshift(message); state.log = state.log.slice(0, 7); }
      function effectText(event) { return event.effect ? `<br><b>${event.effect}</b>` : ""; }
      function setEvent(title, copy, effect) { state.event = { title, copy, effect }; }
      function marketSignal(good) {
        const ratio = state.prices[good.id] / good.base;
        if (ratio < .82) return "זול היום";
        if (ratio > 1.2) return "חם היום";
        return "מחיר רגיל";
      }
      function careerStage() {
        if (state.fame >= 48) return { name:"במאי/ת עולה", copy:"יש לך כבר שם קטן, קהל, וסיבה טובה לספר על הסרט הבא." };
        if (state.fame >= 24) return { name:"יוצר/ת סרט קצר", copy:"עכשיו מחפשים את העסקה שתיקח את הסרט מהרעיון למסך." };
        if (state.fame >= 9) return { name:"איש/אשת צוות", copy:"הקרדיטים הראשונים נצברים. מישהו כבר יודע את השם שלך." };
        return { name:"סטודנט/ית לקולנוע", copy:"כל עסקה קטנה יכולה לקנות לך זמן, ציוד או קרדיט ראשון." };
      }
      const FILM_REQUIREMENTS = ["script", "set", "camera", "sound"];
      function hasItem(id) { return (state.bag[id] || 0) > 0; }
      function filmMissing() { return FILM_REQUIREMENTS.filter((id) => !hasItem(id)); }
      function priceMove(id) {
        const now = state.prices[id], before = state.previousPrices[id] || now;
        const percent = before ? Math.round(((now - before) / before) * 100) : 0;
        return { percent, tone: percent > 0 ? "up" : percent < 0 ? "down" : "steady" };
      }
      function advanceWeek(reason) {
        state.day += 1;
        state.debt = Math.ceil(state.debt * 1.008);
        state.previousPrices = { ...state.prices };
        state.prices = generatePrices(state.city);
        addLog("שבוע " + state.day + ": " + reason + " החוב צמח ב־0.8%.");
        if (state.day > state.maxDays) { finish(); return true; }
        triggerTravelEvent();
        return false;
      }
      function buy(id) {
        if (state.ended || state.event) return false;
        const price = state.prices[id];
        if (totalBag() >= state.capacity) return notify("אין מקום בתיק", "מכור משהו או חכה להזדמנות להגדיל אותו.", "התיק מלא");
        if (state.cash < price) return notify("אין מספיק מזומן", "המחיר גבוה מהכסף הזמין כרגע.", "חסר " + money(price - state.cash));
        state.cash -= price; state.bag[id] = (state.bag[id] || 0) + 1;
        addLog("קנית " + item(id).name + " ב־" + money(price) + "."); save(); render(); return true;
      }
      function sell(id) {
        if (state.ended || state.event || !(state.bag[id] || 0)) return false;
        const good = item(id), price = state.prices[id];
        state.bag[id] -= 1; if (!state.bag[id]) delete state.bag[id];
        state.cash += price; state.fame += good.fame; state.followers += good.fame * randomInt(9, 25);
        addLog("מכרת " + good.name + " ב־" + money(price) + "."); save(); render(); return true;
      }
      function payDebt() {
        if (state.ended || state.event) return false;
        const amount = Math.min(state.cash, state.debt, 500);
        if (!amount) return notify("אין מה לשלם", "צריך מזומן כדי להקטין את החוב.", "");
        state.cash -= amount; state.debt -= amount; addLog("הורדת " + money(amount) + " מהחוב."); save(); render(); return true;
      }
      function produceFilm() {
        if (state.ended || state.event) return false;
        const missing = filmMissing();
        if (missing.length) return notify("עדיין אין סרט לצלם", "חסרים: " + missing.map((id) => item(id).name).join(" · ") + ".", "מצלמה וסאונד נשארים בתיק; תסריט ויום סט ייצרכו בצילום.");
        const cost = 180;
        if (state.cash < cost) return notify("חסר תקציב לצילום", "צריך " + money(cost) + " לביטוח, נסיעות ואוכל לצוות.", "");
        state.cash -= cost;
        ["script", "set"].forEach((id) => { state.bag[id] -= 1; if (!state.bag[id]) delete state.bag[id]; });
        const qualityBonus = (hasItem("lights") ? 3 : 0) + (hasItem("edit") ? 3 : 0);
        const credits = 10 + qualityBonus;
        state.films += 1; state.fame += credits; state.followers += credits * randomInt(16, 34);
        if (advanceWeek("צילמת סרט קצר #" + state.films + " וקיבלת " + credits + " קרדיטים.")) return true;
        save(); render(); return true;
      }
      function triggerTravelEvent() {
        const roll = Math.random();
        if (roll < .19) {
          const target = GOODS[randomInt(0, GOODS.length - 1)]; state.prices[target.id] = Math.round(state.prices[target.id] * .55 / 5) * 5;
          setEvent("מחסן הפקה מתפנה", "הפקה שנסגרה משחררת " + target.name + " במחיר רצפה בעיר הזאת.", "המחיר של " + target.name + " ירד ב־45%.");
        } else if (roll < .35) {
          const target = GOODS[randomInt(0, GOODS.length - 1)]; state.prices[target.id] = Math.round(state.prices[target.id] * 1.75 / 5) * 5;
          setEvent("הפקה גדולה נתקעה", "הם מחפשים " + target.name + " בלי להתמקח. בדיוק הרגע למכור אם יש לך.", "המחיר קפץ ב־75%.");
        } else if (roll < .47) {
          state.capacity += 3; setEvent("תיק ציוד נוסף", "בוגר/ת שנה ד׳ מסר/ה לך תיק קשיח. הוא לא יפה, אבל הוא פותח עוד שלוש עסקאות.", "+3 מקומות בתיק.");
        } else if (roll < .58) {
          const loss = Math.min(state.cash, randomInt(70, 160)); state.cash -= loss;
          setEvent("שכר לימוד מזכיר את עצמו", "הודעה ישנה חזרה בדיוק כשנחתת. אין סיכוי להתעלם ממנה.", "-" + money(loss) + " מזומן.");
        } else if (roll < .68) {
          const target = item("festival"); state.prices.festival = Math.round(state.prices.festival * .62 / 5) * 5;
          setEvent("הרשמה מוקדמת לפסטיבל", "חלון הגשה נפתח הערב בלבד. " + target.name + " זולה מהרגיל.", "מחיר ההגשה ירד ב־38%.");
        } else if (roll < .77) {
          const target = item("camera"); state.prices.camera = Math.round(state.prices.camera * 1.45 / 5) * 5;
          setEvent("כל העיר צריכה מצלמה", "סדרה חדשה התחילה לצלם, וכל קיט מצלמה הפך פתאום לזהב.", "מחיר מצלמה עלה ב־45%.");
        } else if (roll < .85) {
          const bonus = randomInt(1, 2); state.fame += bonus;
          setEvent("מרצה זכר/ה את העבודה שלך", "הפניה קטנה ליום סט הגיעה משום מקום.", "+" + bonus + " קרדיטים.");
        } else if (roll < .92 && hasItem("camera")) {
          const repair = Math.min(state.cash, 95); state.cash -= repair;
          setEvent("המצלמה צריכה תיקון", "היא עדיין עובדת, אבל לא לפני טיפול קטן ומעצבן.", "-" + money(repair) + " מזומן.");
        } else if (roll < .98) {
          state.followers += 90;
          setEvent("קליפ מהלימודים תפס", "קטע קצר מהתהליך קיבל שיתופים בלי שביקשת.", "+90 עוקבים.");
        } else if (roll < .986) {
          state.prices.edit = Math.round(state.prices.edit * .58 / 5) * 5;
          setEvent("חדר העריכה מתפנה", "לילה שלם בעמדת עריכה הוצע במחיר של קפה ולחץ.", "מחיר העריכה ירד ב־42%.");
        } else if (roll < .992) {
          state.cash += 180;
          setEvent("גיג צילום קטן", "מישהו צריך יד נוספת ליום צילום מחר. זה לא קרדיט ענק, אבל זה משלם חשבון.", "+" + money(180) + " מזומן.");
        } else if (state.films > 0) {
          state.fame += 7;
          setEvent("הסרט נכנס להקרנה", "הודעה קצרה מפסטיבל קטן: הסרט שלך קיבל מקום בלוח.", "+7 קרדיטים.");
        }
      }
      function travel(id) {
        if (state.ended || state.event || id === state.city) return false;
        const destination = CITIES.find((entry) => entry.id === id); if (!destination) return false;
        if (state.cash < destination.fare) return notify("אין כסף לטיסה", "צריך " + money(destination.fare) + " כדי להגיע ל" + destination.name + ".", "");
        state.cash -= destination.fare; state.city = id;
        if (advanceWeek("טסת ל" + destination.name + ".")) return true;
        save(); render(); return true;
      }
      function notify(title, copy, effect) { setEvent(title, copy, effect); render(); return false; }
      function dismissEvent() { state.event = null; save(); render(); }
      function finish() { state.ended = true; state.event = null; const inventory = Object.entries(state.bag).reduce((sum, [id, qty]) => sum + state.prices[id] * qty, 0); const score = state.cash + inventory - state.debt + state.fame * 100; state.final = { inventory, score }; addLog("המסלול נסגר עם ציון " + money(score) + "."); save(); render(); }
      function newGame() { state = createState(); save(); render(); }
      function renderModal() {
        if (!modal) return;
        if (state.ended) {
          const final = state.final || { inventory:0, score:0 };
          modal.classList.remove("hidden"); modal.innerHTML = `<section class="event"><span>סוף המסלול · 30 שבועות</span><h2>${careerStage().name}</h2><p>${final.score >= 0 ? "סגרת ריצה עם חומר, ניסיון וסיבה להתחיל את הסרט הבא." : "החוב עדיין שם, אבל גם הקרדיטים והאנשים שהכרת בדרך."}</p><div class="end-score"><div><span>מזומן</span><b>${money(state.cash)}</b></div><div><span>שווי תיק</span><b>${money(final.inventory)}</b></div><div><span>חוב</span><b>${money(state.debt)}</b></div></div><button data-action="new">להתחיל מסלול חדש ←</button></section>`; return;
        }
        if (!state.event) { modal.classList.add("hidden"); modal.innerHTML = ""; return; }
        modal.classList.remove("hidden"); modal.innerHTML = `<section class="event"><span>אירוע בדרך</span><h2>${state.event.title}</h2><p>${state.event.copy}${effectText(state.event)}</p><button data-action="dismiss">להמשיך לשוק ←</button></section>`;
      }
      function render() {
        if (!app) return;
        const here = city(), used = totalBag(), stage = careerStage(), missing = filmMissing();
        const filmReady = missing.length === 0 && state.cash >= 180 && !state.event;
        const focus = state.debt > 0 ? "קנה נכס הפקה כשהוא זול, טוס לעיר שבה הוא נדרש, ומכור כדי לממן את הצעד הבא." : "החוב נסגר. עכשיו כל עסקה יכולה לבנות את הסרט ואת השם שלך.";
        const bagRows = Object.entries(state.bag).map(([id, qty]) => `<div class="bag-row"><span>${item(id).name}</span><b>×${qty}</b></div>`).join("");
        app.innerHTML = `<div class="shell">
          <header class="topbar"><div class="brand">KOBI <b>/</b> FIRST CUT</div><div class="turn"><span>שבועות נשארו</span><strong>${Math.max(0, state.maxDays - state.day + 1)}</strong></div></header>
          <section class="headline"><div><p class="eyebrow">${here.name} · ${here.zone}</p><h1>סטודנט/ית היום. במאי/ת מחר.</h1></div><p>30 שבועות לסגור חוב לימודים, לאסוף קרדיטים, ולממן את הסרט הראשון שלך.</p></section>
          <section class="command"><div class="panel mission"><i class="mission-mark"><b>✦</b></i><div><span>המסלול שלך</span><strong>${stage.name}</strong><p>${stage.copy} ${focus}</p></div></div><div class="panel finance"><div><label>מזומן</label><b>${money(state.cash)}</b></div><div class="debt"><label>חוב לימודים</label><b>${money(state.debt)}</b></div><div class="fame"><label>קרדיטים</label><b>${state.fame}</b></div><div class="slots"><label>תיק הפקה</label><b>${used}/${state.capacity}</b></div></div></section>
          <section class="panel production"><div><span class="production-kicker">הסרט הראשון · ${state.films} צולמו</span><h2>${missing.length ? "אוספים ציוד לפני הצילום" : "הכול מוכן לצילום"}</h2><p>תסריט ויום סט נצרכים. מצלמה וסאונד נשארים אצלך. תאורה ועריכה משפרות את הקרדיטים.</p><div class="film-requirements">${["script","set","camera","sound","lights","edit"].map((id) => `<span class="${hasItem(id) ? "ready" : ""}">${hasItem(id) ? "✓ " : ""}${item(id).name}${["lights","edit"].includes(id) ? " · בונוס" : ""}</span>`).join("")}</div></div><button data-action="produce" ${filmReady ? "" : "disabled"}>לצלם סרט קצר<br><small>שבוע אחד · ${money(180)}</small></button></section>
          <section class="grid"><main class="panel market"><header class="market-head"><div><span class="market-kicker">הזדמנויות מקומיות · שבוע ${state.day}/30</span><h2>מה זול ב${here.name}?</h2></div><p>החץ משווה לשבוע הקודם.<br>ירוק = מחיר ירד; אדום = מחיר עלה.</p></header><div class="goods">${GOODS.map((good) => { const owned=state.bag[good.id]||0, price=state.prices[good.id], move=priceMove(good.id), arrow=move.percent>0?"▲":move.percent<0?"▼":"—"; return `<article class="good"><div><div class="good-top"><span class="good-title">${good.name}</span><span class="good-owned">בתיק: ${owned}</span></div><p class="good-note">${good.note} · ${marketSignal(good)}</p></div><div class="price-wrap"><b class="price">${money(price)}</b><span class="market-move ${move.tone}">${arrow} ${Math.abs(move.percent)}% מהשבוע שעבר</span></div><div class="deal-actions"><button data-action="buy" data-id="${good.id}" ${state.cash<price||used>=state.capacity?"disabled":""}>קנה</button><button class="sell" data-action="sell" data-id="${good.id}" ${owned?"":"disabled"}>מכור</button></div></article>`; }).join("")}</div></main>
          <aside class="rail"><section class="panel"><h2>טיסה לעיר אחרת</h2><div class="travel">${CITIES.map((place) => `<button class="${place.id===state.city?"current":""}" data-action="travel" data-id="${place.id}"><span>${place.name}<small> · ${place.zone}</small></span><b>${place.id===state.city?"כאן":""+(place.fare?money(place.fare):"חינם")}</b></button>`).join("")}</div></section><section class="panel"><h2>תיק ההפקה</h2><div class="bag">${bagRows||'<p class="bag-empty">התיק ריק. מתחילים בעסקה קטנה שמאפשרת את הצילום הבא.</p>'}</div></section><section class="panel"><h2>מימון לימודים</h2><div class="debt-control"><p>בכל טיסה החוב גדל ב־0.8%. משלמים 500 ₪ כדי לקנות עוד חופש.</p><button data-action="pay">להחזיר 500 ₪</button></div></section><section class="panel log-panel"><h2>יומן הפקה</h2><div class="log">${state.log.map((line)=>`<p>› ${line}</p>`).join("")}</div></section></aside></section>
          <div class="footer-actions"><button data-action="finish">לסכם את המסלול</button><button data-action="new">מסלול חדש</button></div>
        </div>`;
        renderModal();
      }
      if (app) {
        load(); render();
        document.addEventListener("click", (event) => { const button = event.target.closest("[data-action]"); if (!button) return; const action=button.dataset.action, id=button.dataset.id; if (action==="buy") buy(id); if (action==="sell") sell(id); if (action==="travel") travel(id); if (action==="pay") payDebt(); if (action==="produce") produceFilm(); if (action==="dismiss") dismissEvent(); if (action==="finish") finish(); if (action==="new") newGame(); });
      }
      globalThis.kobiNightMarket = { getState:()=>clone(state), newGame, buy, sell, travel, payDebt, produceFilm, finish, dismissEvent, GOODS, CITIES };
    })();
  </script>
</body>
</html>
