<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#080c14">
  <title>קובי / קריירה</title>
  <style>
    :root { --ink:#080c14; --panel:#141c2c; --panel-2:#1d2840; --line:#34415a; --cream:#f7f2e8; --muted:#9ca8ba; --amber:#f4bd4b; --green:#67cfc4; --blue:#93b6e0; --rose:#e28c83; --violet:#b79aef; }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--cream); background:radial-gradient(800px 460px at 12% 0%,rgba(77,63,166,.24),transparent 68%),radial-gradient(580px 340px at 96% 7%,rgba(43,114,138,.14),transparent 68%),var(--ink); font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif; }
    button { font:inherit; }
    button:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
    .shell { width:min(1120px,calc(100% - 34px)); margin:0 auto; padding:26px 0 38px; }
    .topbar { position:sticky; top:0; z-index:8; display:flex; align-items:center; justify-content:space-between; gap:18px; padding:12px 0; border-bottom:1px solid rgba(229,238,255,.14); background:rgba(8,12,20,.92); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); }
    .brand { color:var(--amber); font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:1.1rem; font-weight:900; letter-spacing:.13em; }
    .turn { display:flex; flex-wrap:wrap; justify-content:flex-end; gap:14px; align-items:baseline; }
    .turn div { color:var(--muted); font-size:.69rem; text-align:left; }
    .turn b { display:block; margin-top:3px; color:var(--cream); font-size:1rem; }
    .turn .debt b { color:var(--rose); }
    .turn .fame b { color:var(--green); }
    .turn .followers b { color:var(--amber); }
    .turn .contacts b { color:var(--blue); }
    .mini-pay { margin-inline-start:5px; padding:2px 6px; cursor:pointer; color:var(--rose); border:1px solid rgba(226,140,131,.4); border-radius:5px; background:rgba(226,140,131,.08); font-size:.6rem; font-weight:800; }
    .stage-track { display:flex; flex-wrap:wrap; gap:6px; margin:12px 0 0; }
    .stage-node { padding:5px 10px; color:#5b6478; border:1px solid rgba(229,238,255,.13); border-radius:999px; background:rgba(255,255,255,.025); font-size:.63rem; font-weight:800; }
    .stage-node.current { color:#171307; border-color:var(--amber); background:var(--amber); }
    .stage-node.done { color:var(--green); border-color:rgba(103,207,196,.5); background:rgba(103,207,196,.07); }
    .panel { border:1px solid rgba(229,238,255,.15); border-radius:15px; background:linear-gradient(145deg,rgba(29,38,59,.96),rgba(12,17,28,.98)); box-shadow:0 18px 45px rgba(0,0,0,.22); margin-top:15px; padding:24px; }
    .eyebrow { margin:0 0 5px; color:var(--amber); font-size:.71rem; font-weight:900; letter-spacing:.09em; }
    h1,h2,h3,p { margin-top:0; }
    h1 { margin-bottom:0; font-size:clamp(1.5rem,3vw,2.2rem); letter-spacing:-.04em; line-height:1.05; }
    .next-move { display:flex; align-items:center; justify-content:space-between; gap:13px; margin:0 0 15px; padding:12px 14px; border:1px solid rgba(244,189,75,.5); border-radius:10px; background:rgba(244,189,75,.07); }
    .next-move small { display:block; color:var(--amber); font-size:.65rem; font-weight:900; letter-spacing:.06em; }
    .next-move b { display:block; margin-top:3px; color:var(--cream); font-size:.94rem; }
    .next-move span { display:block; margin-top:3px; color:var(--muted); font-size:.7rem; line-height:1.4; }
    .milestone-list { display:flex; flex-wrap:wrap; gap:6px; margin-top:9px; }
    .milestone { padding:4px 9px; color:var(--muted); border:1px solid rgba(229,238,255,.15); border-radius:999px; background:rgba(255,255,255,.03); font-size:.65rem; font-weight:750; }
    .milestone.required { border-color:rgba(244,189,75,.4); }
    .milestone.done { color:var(--green); border-color:rgba(103,207,196,.5); background:rgba(103,207,196,.08); }
    .milestone-progress { margin-top:10px; }
    .progress-label { display:flex; justify-content:space-between; font-size:.68rem; color:var(--cream); font-weight:750; }
    .progress-track { position:relative; height:8px; margin-top:4px; border-radius:5px; background:rgba(255,255,255,.08); overflow:hidden; }
    .progress-fill { height:100%; background:var(--amber); border-radius:5px; }
    .milestone-progress.done .progress-fill { background:var(--green); }
    .milestone-progress.done .progress-label { color:var(--green); }
    .market-table { width:100%; margin-top:8px; border-collapse:collapse; font-size:.78rem; }
    .market-table th { padding:6px 4px; color:var(--amber); font-size:.62rem; font-weight:900; letter-spacing:.05em; text-align:right; border-bottom:1px solid rgba(229,238,255,.15); }
    .market-table td { padding:9px 4px; border-bottom:1px solid rgba(229,238,255,.08); vertical-align:middle; color:var(--cream); }
    .market-table td small { color:var(--muted); font-size:.66rem; }
    .market-table td.actions { display:flex; gap:6px; justify-content:flex-end; white-space:nowrap; }
    .recommend-actions { display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .primary,.back,.service-row,.row-action,.footer-actions button,.event button { min-height:34px; padding:7px 11px; cursor:pointer; border-radius:7px; font-size:.74rem; font-weight:850; }
    .primary { color:#191307; border:0; background:var(--amber); }
    .back { color:#cbd5e6; border:1px solid rgba(229,238,255,.15); background:rgba(255,255,255,.045); }
    .service-list { border-top:1px solid rgba(229,238,255,.12); }
    .market-tabs { display:flex; gap:4px; margin:16px 0 0; }
    .market-tab { flex:1; min-height:38px; padding:9px 6px; cursor:pointer; color:var(--muted); border:0; border-bottom:2px solid transparent; background:transparent; font-size:.74rem; font-weight:850; white-space:nowrap; }
    .market-tab.active { color:var(--amber); border-bottom-color:var(--amber); }
    .market-tab:not(.active):hover { color:var(--cream); }
    .action-row { display:grid; grid-template-columns:minmax(0,1fr) auto; align-items:center; gap:15px; min-height:73px; padding:12px 0; border-bottom:1px solid rgba(229,238,255,.11); }
    .action-row h3 { margin:0; font-size:.94rem; }
    .action-row p { margin:4px 0 0; color:var(--muted); font-size:.72rem; line-height:1.4; }
    .action-meta { display:grid; justify-items:end; gap:7px; text-align:left; }
    .action-meta b { color:var(--green); font-size:.72rem; white-space:nowrap; }
    .row-action { color:#171307; border:0; background:var(--amber); white-space:nowrap; }
    .row-action.quiet { color:#dbe4f4; border:1px solid rgba(229,238,255,.16); background:rgba(255,255,255,.045); }
    .row-action:disabled { opacity:.4; cursor:not-allowed; }
    .trend-up { color:var(--rose); font-size:.62rem; font-weight:900; }
    .trend-down { color:var(--green); font-size:.62rem; font-weight:900; }
    .final-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:16px 0; }
    .final-grid.recap { margin:0 0 16px; }
    .final-grid div { padding:9px; border-radius:8px; background:rgba(255,255,255,.055); }
    .final-grid small { color:var(--muted); font-size:.64rem; }
    .final-grid b { display:block; margin-top:4px; color:var(--cream); font-size:.84rem; }
    .bag { padding:24px; }
    .bag-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:9px; margin-top:10px; }
    .bag-item { display:flex; justify-content:space-between; gap:10px; padding:12px; border:1px solid rgba(229,238,255,.12); border-radius:9px; background:rgba(255,255,255,.025); color:var(--muted); font-size:.78rem; }
    .bag-item b { color:var(--cream); }
    .empty { padding:20px 0; color:var(--muted); font-size:.82rem; }
    .service-top { display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:8px; }
    .footer-actions { display:flex; justify-content:space-between; gap:10px; margin-top:15px; }
    .footer-actions button { color:var(--muted); border:1px solid rgba(229,238,255,.15); background:rgba(255,255,255,.045); }
    .footer-actions button:first-child { color:var(--rose); }
    .modal { position:fixed; z-index:10; inset:0; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.68); }
    .modal.hidden { display:none; }
    .event { width:min(500px,100%); padding:24px; border:1px solid rgba(244,189,75,.7); border-radius:16px; background:linear-gradient(145deg,#1c263b,#101621); box-shadow:0 28px 80px rgba(0,0,0,.6); }
    .event span { color:var(--amber); font-size:.69rem; font-weight:900; letter-spacing:.08em; }
    .event h2 { margin:8px 0; font-size:1.55rem; }
    .event p { margin:0 0 17px; color:var(--muted); font-size:.84rem; line-height:1.55; }
    .event-options { display:grid; gap:7px; }
    .event button { width:100%; color:#171307; border:0; background:var(--amber); text-align:right; }
    .event button.quiet { color:#dbe4f4; border:1px solid rgba(229,238,255,.15); background:rgba(255,255,255,.045); }
    .poster-card { width:min(260px,100%); margin:6px auto 17px; padding:18px; border:2px solid var(--amber); border-radius:12px; background:linear-gradient(160deg,var(--panel-2),var(--ink)); text-align:center; }
    .poster-card .poster-genre { display:block; letter-spacing:.1em; color:var(--amber); font-size:.62rem; font-weight:900; text-transform:uppercase; }
    .poster-card .poster-title { margin:8px 0; color:var(--cream); font-size:1.15rem; }
    .poster-card .poster-tagline { margin:0; color:var(--muted); font-size:.72rem; font-style:italic; }
    .poster-card .poster-credits { display:block; margin-top:8px; color:var(--muted); font-size:.65rem; }
    .event.brief { border-color:rgba(147,182,224,.7); }
    .event.brief span { color:var(--blue); }
    .event.brief .final-grid.recap { margin-top:2px; }
    .event.forecast { border-color:rgba(103,207,196,.7); }
    .event.forecast span { color:var(--green); }
    .event.intro { border-color:rgba(183,154,239,.7); }
    .event.intro span { color:var(--violet); }
    .event.intro .primary { margin-bottom:7px; }
    @media (max-width:720px) { .action-row { align-items:start; } .next-move { align-items:start; display:grid; } }
    @media (max-width:520px) {
      .shell { width:min(100% - 20px,1120px); padding-top:15px; }
      .topbar { align-items:start; display:grid; }
      .turn { display:grid; grid-template-columns:repeat(4,1fr); justify-content:normal; gap:10px 6px; width:100%; }
      .turn div { text-align:center; }
      .panel,.bag { padding:16px; }
      .bag-grid { grid-template-columns:1fr; }
      .action-meta { justify-items:start; text-align:right; }
      .final-grid { grid-template-columns:repeat(2,1fr); }
      .primary,.back,.service-row,.row-action,.footer-actions button,.event button { min-height:44px; }
      .market-table td.actions { gap:8px; }
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="modal" class="modal hidden"></div>
  <script>
    (() => {
      // Cities are dormant in Phase 1 — reactivated in Phase 3 as the festival-stage
      // flight-milestone destination list. Not used by any function yet.
      const CITIES = [
        { id:"tlv", name:"תל אביב", zone:"ישראל", fare:0, copy:"בית.", mods:{} },
        { id:"jerusalem", name:"ירושלים", zone:"ישראל", fare:90, copy:"מוסדות וקרנות.", mods:{} },
        { id:"haifa", name:"חיפה", zone:"ישראל", fare:110, copy:"ציוד ופוסט.", mods:{} },
        { id:"athens", name:"אתונה", zone:"אירופה · פסטיבלים", fare:260, copy:"הגשות והפצה בינלאומית.", mods:{distroRights:1.1, screeningWindow:1.2, streamingDeal:.95, salesAgentContract:1.0} },
        { id:"berlin", name:"ברלין", zone:"אירופה · בתי קולנוע", fare:440, copy:"פסטיבלי קולנוע וקשרים מקצועיים.", mods:{distroRights:1.05, screeningWindow:1.15, streamingDeal:1.0, salesAgentContract:1.1} },
        { id:"london", name:"לונדון", zone:"אירופה · קו־פרודוקציה", fare:510, copy:"מפיקים והפצה בינלאומית.", mods:{distroRights:1.2, screeningWindow:1.0, streamingDeal:1.1, salesAgentContract:1.15} },
        { id:"newyork", name:"ניו יורק", zone:"ארה״ב · אינדי וקהל", fare:900, copy:"הקרנות אינדי ומפיצים.", mods:{distroRights:1.15, screeningWindow:1.1, streamingDeal:1.25, salesAgentContract:1.2} },
        { id:"losangeles", name:"לוס אנג׳לס", zone:"ארה״ב · אולפנים והפצה", fare:1080, copy:"פגישות אולפן ועסקאות גדולות.", mods:{distroRights:1.3, screeningWindow:1.2, streamingDeal:1.3, salesAgentContract:1.35} }
      ];
      const FLIGHT_CITY_IDS = ["athens","berlin","london","newyork","losangeles"];

      const DEFAULT_RISK = { crashChance:.05, spikeChance:.05, unavailableChance:.03, crashRange:[.3,.5], spikeRange:[1.6,2.4] };
      const DEBT_ANNUAL_RATE = 1.028;
      const GIG_YEARS = 0.4;
      const BANK_ANNUAL_RATE = 1.015;
      const BLACK_MARKET_LOAN = { cash:1500, debt:2100 };

      const FILM_GENRE_CHOICES = [
        { id:"drama", label:"דרמה", effect:(s)=>{ s.fame+=1; s.filmDraft.genre="דרמה"; } },
        { id:"comedy", label:"קומדיה", effect:(s)=>{ s.followers+=300; s.filmDraft.genre="קומדיה"; } },
        { id:"documentary", label:"תיעודי", effect:(s)=>{ s.contacts+=1; s.filmDraft.genre="תיעודי"; } }
      ];
      const FILM_GENRE_TITLES = {
        "דרמה": ["אור שבור","המרחק שבינינו","מה שלא נאמר"],
        "קומדיה": ["טעות באיפור","כולם מחכים לשף","פחות או יותר משפחה"],
        "תיעודי": ["מה שנשאר","קול מהשטח","הסיפור שלא סופר"]
      };
      const FILM_GENRE_TAGLINES = {
        "דרמה": "לפעמים הכי קשה זה לא לזוז.",
        "קומדיה": "כולם רצו סוף אחר.",
        "תיעודי": "האמת הייתה שם כל הזמן."
      };
      const FILM_ACTOR_NAMES = ["דנה","עידן","נועה","גיא","שירה","אורי"];

      function genreCheckpointChoices() {
        return FILM_GENRE_CHOICES.map((g)=>({ label:g.label, kind:"genre-"+g.id, effect:g.effect }));
      }

      function posterHtml(draft) {
        const genre = draft.genre || "דרמה";
        const titles = FILM_GENRE_TITLES[genre] || FILM_GENRE_TITLES["דרמה"];
        if (!draft.title) draft.title = titles[Math.floor(Math.random()*titles.length)];
        const tagline = FILM_GENRE_TAGLINES[genre] || "";
        const starring = draft.starName || "קובי";
        return `<div class="poster-card"><small class="poster-genre">${genre}</small><h3 class="poster-title">${draft.title}</h3><p class="poster-tagline">${tagline}</p><span class="poster-credits">בימוי: קובי · בכיכוב: ${starring}</span></div>`;
      }
      const BANKRUPTCY_STRIKE_LIMIT = 3;
      const STAGE_GRACE_YEARS = 3;
      const DEBT_COLLECTOR_MIN_DEBT = 3000;
      const DEBT_COLLECTOR_YEARS = 3;

      const UNIVERSAL_INCIDENTS = [
        { id:"bank-call", chance:.10, when:(s)=>s.debt>0, title:"הבנק מתקשר", copy:"החוב צבר ריבית והפקיד/ה מבקש/ת תשלום קטן עכשיו.", choices:[{label:"לשלם ₪500 מהחוב",kind:"debt-pay"},{label:"לדחות · החוב גדל ב-₪300",kind:"debt-delay",quiet:true}] },
        { id:"road-gig", chance:.08, title:"עבודה בדרך", copy:"מישהו מחפש עזרה דחופה. זו דרך מהירה למזומן, אבל היא עולה שנה.", choices:[{label:"לקחת · +₪600",kind:"road-gig"},{label:"להמשיך במסלול",kind:"pass",quiet:true}] }
      ];

      function studentRecommend(s) {
        if (s.commitment) {
          return { title:"ממשיכים בהתחייבות הנוכחית", copy:"שנה "+Math.round(s.commitment.elapsedYears)+" מתוך "+s.commitment.totalYears+".", action:null, alternatives:[] };
        }
        if (!hasChosenEntryPath()) {
          return { title:"לבחור מסלול כניסה", copy:"לימודי קולנוע, קורס קצר, או מסלול עצמאי — הבחירה קובעת את תחילת הדרך.", action:{type:"commitment",id:"filmSchool"}, actionLabel:"להתחיל לימודי קולנוע", alternatives:[{type:"commitment",id:"shortCourse",label:"קורס קצר"},{type:"commitment",id:"selfTaught",label:"מסלול עצמאי"}] };
        }
        if (s.fame < 6) {
          return { title:"לצבור קרדיט מקצועי", copy:"עבודה בתעשייה עצמה בונה קרדיט וקשרים — צריך כמה שנים של זה כדי לצבור קרדיט מקצועי אמיתי, לא רק פעם אחת.", action:{type:"gig",id:"prodAssist"}, actionLabel:"לעבוד כעוזר/ת הפקה", alternatives:[{type:"gig",id:"photostore",label:"חנות צילום"}] };
        }
        if ((s.cash+s.bank) < 5000) {
          return { title:"לבנות רשת ביטחון כלכלית", copy:"יש כבר קרדיט מקצועי — עכשיו צריך לצבור מספיק כסף כדי לצאת לשלב הבא בביטחון.", action:{type:"gig",id:"waiter"}, actionLabel:"לעבוד כמלצר/ית", alternatives:[{type:"gig",id:"usher",label:"סדרן/ית"}] };
        }
        return { title:"מוכנים להתקדם", copy:"היעדים המרכזיים של השלב הושלמו — עוד פעולה תסיים אותו.", action:{type:"gig",id:"waiter"}, actionLabel:"לעבוד כמלצר/ית", alternatives:[] };
      }

      function industryRecommend(s) {
        if (s.fame < 16) {
          return { title:"לבנות קרדיט בתעשייה", copy:"הקרדיטים מהשלב הקודם לא מספיקים לבד — צריך רצף אמיתי של עבודות מקצועיות.", action:{type:"gig",id:"camAssist"}, actionLabel:"לעבוד כעוזר/ת צלם", alternatives:[{type:"gig",id:"gaffer",label:"חשמלאי/ת תאורה"}] };
        }
        if (s.contacts < 6) {
          return { title:"להרחיב רשת קשרים", copy:"בלי מספיק קשרים אין עם מי להרכיב צוות לסרט הראשון.", action:{type:"gig",id:"gaffer"}, actionLabel:"לעבוד כחשמלאי/ת תאורה", alternatives:[{type:"gig",id:"lineProducer",label:"מפיק/ת קו"}] };
        }
        return { title:"מוכנים להתקדם", copy:"היעדים המרכזיים של השלב הושלמו — עוד פעולה תסיים אותו.", action:{type:"gig",id:"camAssist"}, actionLabel:"לעבוד כעוזר/ת צלם", alternatives:[] };
      }

      function indieRecommend(s) {
        if (s.commitment) {
          return { title:"ממשיכים בהפקת הסרט", copy:"שנה "+Math.round(s.commitment.elapsedYears)+" מתוך "+s.commitment.totalYears+".", action:null, alternatives:[] };
        }
        if (!hasChosenEntryPath()) {
          return { title:"להתחיל להפיק את הסרט", copy:"זה הרגע — 3 שנים של התחייבות אמיתית להפוך רעיון לסרט.", action:{type:"commitment",id:"indieFilm"}, actionLabel:"להתחיל את ההפקה", alternatives:[] };
        }
        if ((s.cash+s.bank) < 500) {
          return { title:"לייצב את המצב הכלכלי", copy:"אחרי ההפקה כדאי לחזור לאיזון.", action:{type:"gig",id:"commercialGig"}, actionLabel:"לעבוד בעבודה מסחרית", alternatives:[] };
        }
        return { title:"מוכנים להתקדם", copy:"הסרט מוכן ויש בסיס כלכלי — עוד פעולה תסיים את השלב.", action:{type:"gig",id:"commercialGig"}, actionLabel:"לעבוד בעבודה מסחרית", alternatives:[] };
      }

      function festivalsRecommend(s) {
        if (s.fame < 30) {
          return { title:"להרחיב מוניטין בינלאומי", copy:"פאנלים והשתתפות בפסטיבלים בונים שם מעבר לגבולות — וטיסת-ציון נדירה תוצע מדי פעם משלב הזה בלבד.", action:{type:"gig",id:"festivalPanel"}, actionLabel:"להשתתף בפאנל", alternatives:[{type:"gig",id:"consultingGig",label:"ייעוץ"}] };

      const STORAGE_KEY = "kobi-career-v2";
      const SCORES_KEY = "kobi-career-v2-scores";
      const app = typeof document !== "undefined" ? document.getElementById("app") : null;
      const modal = typeof document !== "undefined" ? document.getElementById("modal") : null;
      const money = (value) => new Intl.NumberFormat("he-IL", { style:"currency", currency:"ILS", maximumFractionDigits:0 }).format(Math.round(value));
      const clone = (value) => JSON.parse(JSON.stringify(value));

      function currentStage() { return STAGES.find((s) => s.id === state.stageId) || STAGES[0]; }
      function round5(n) { return Math.max(25, Math.round(n / 5) * 5); }
      function formatDuration(years) {
        if (years >= 1) return years + (years===1 ? " שנה" : " שנים");
        const seasons = Math.max(1, Math.round(years * 4));
        return seasons + (seasons===1 ? " עונה" : " עונות");
      }

      function priceRoll(base, rp) {
        const roll = Math.random();
        if (roll < rp.crashChance) return { price: round5(base*(rp.crashRange[0]+Math.random()*(rp.crashRange[1]-rp.crashRange[0]))), kind:"crash" };
        if (roll < rp.crashChance+rp.spikeChance) return { price: round5(base*(rp.spikeRange[0]+Math.random()*(rp.spikeRange[1]-rp.spikeRange[0]))), kind:"spike" };
        if (roll < rp.crashChance+rp.spikeChance+rp.unavailableChance) return { price:null, kind:"unavailable" };
        return { price: round5(base*(.72+Math.random()*.66)), kind:"normal" };
      }

      function generateMarket(stageId) {
        const stage = STAGES.find((s) => s.id === stageId) || STAGES[0];
        const rp = stage.riskProfile || DEFAULT_RISK;
        const prices = {}, kinds = {};
        (stage.goods||[]).forEach((g) => { const roll = priceRoll(g.base, rp); prices[g.id]=roll.price; kinds[g.id]=roll.kind; });
        return { prices, kinds };
      }

      function createState() {
        const next = {
          age:21, year:1, retirementAge:81,
          stageId:"student", stageYear:0, nextMilestoneAge:26,
          cash:2700, bank:0, debt:8000,
          fame:0, followers:0, contacts:0,
          capacity:10, bag:{}, prices:{}, previousPrices:{}, priceKinds:{},
          assets:{ usedCamera:false, editComputer:false, diploma:false },
          films:[],
          commitment:null, activeCheckpoint:null, filmDraft:{},
          debtCollectorStreak:0, debtCollectorIgnores:0,
          pathTags:[], bankruptcyStrikes:0,
          view:"hud", marketTab:"work", flight:null,
          funding:{}, achievements:{}, awards:[], event:null, ended:false, win:false, log:[], lastRecap:null, briefPending:false, pendingAction:null, stageIntroPending:true
        };
        const market = generateMarket(next.stageId);
        next.prices = market.prices; next.priceKinds = market.kinds; next.previousPrices = {...market.prices};
        next.log = ["גיל 21: מתחילים עם חוב לימודים ותיק ריק. הזמן לבחור מסלול כניסה."];
        return next;
      }

      let state = createState();

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
          if (saved && typeof saved.age === "number" && typeof saved.stageId === "string" && !saved.ended) {
            const fresh = createState();
            state = {
              ...fresh, ...saved,
              bag: saved.bag || {}, assets: {...fresh.assets, ...(saved.assets||{})},
              prices: {...fresh.prices, ...(saved.prices||{})}, previousPrices: saved.previousPrices || fresh.prices,
              priceKinds: saved.priceKinds || fresh.priceKinds, films: Array.isArray(saved.films) ? saved.films : [],
              awards: Array.isArray(saved.awards) ? saved.awards : [],
              pathTags: Array.isArray(saved.pathTags) ? saved.pathTags : [], commitment: saved.commitment || null,
              funding: {...(saved.funding||{})}, achievements: {...(saved.achievements||{})},
              event: null, briefPending: false, pendingAction: null, stageIntroPending: false, activeCheckpoint: saved.activeCheckpoint || null
            };
          }
        } catch (_) {}
      }
      function save() { try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch (_) {} }
      function addLog(text) { state.log.unshift(text); state.log = state.log.slice(0,200); }
      function pushAward(title) { state.awards.push({ title, age: Math.round(state.age), stage: currentStage().name }); }

      function goodName(id) { const g = currentStage().goods.find((x)=>x.id===id); return g ? g.name : id; }
      function assetName(id) { for (const s of STAGES) { const g=(s.goods||[]).find((x)=>x.id===id); if (g) return g.name; } return id; }
      function bagCount() { return Object.values(state.bag).reduce((sum,qty)=>sum+qty,0); }
      function has(id,qty=1) { return (state.bag[id]||0) >= qty; }
      function missing(needs) { return Object.entries(needs||{}).filter(([id,qty])=>!has(id,qty)).map(([id,qty])=>goodName(id)+(qty>1?" ×"+qty:"")); }
      function remove(id,qty=1) { state.bag[id]-=qty; if (!state.bag[id]) delete state.bag[id]; }
      function sellPrice(id) {
        if (state.prices[id] != null) return state.prices[id];
        if (state.previousPrices[id] != null) return state.previousPrices[id];
        const g = currentStage().goods.find((x)=>x.id===id);
        return g ? g.base : 0;
      }
      function hasChosenEntryPath() {
        const ids = (currentStage().commitments||[]).map((c)=>c.id);
        return !!state.commitment || state.pathTags.some((t)=>ids.includes(t));
      }
      function currentCommitmentConfig(s) {
        if (!s.commitment) return null;
        return (currentStage().commitments||[]).find((c)=>c.id===s.commitment.id) || null;
      }

      function notify(title,copy,choices,html) { state.event = {title,copy,choices,html}; }
      function closeBrief() { state.briefPending = false; save(); render(); return true; }
      function closeStageIntro() { state.stageIntroPending = false; save(); render(); return true; }
      function announce(title,copy) { notify(title,copy,[{label:"להמשיך",kind:"pass"}]); render(); return false; }

      function isWinner() { return false; }

      function loadScores() { try { return JSON.parse(localStorage.getItem(SCORES_KEY)) || []; } catch (_) { return []; } }
      function saveScore(entry) {
        try {
          const list = loadScores();
          list.push(entry);
          list.sort((a,b)=>b.achievement-a.achievement);
          localStorage.setItem(SCORES_KEY, JSON.stringify(list.slice(0,10)));
        } catch (_) {}
      }

      function finish(win) {
        state.ended = true; state.win = !!win; state.event = null;
        const bagValue = Object.entries(state.bag).reduce((sum,[id,qty])=>sum+sellPrice(id)*qty,0);
        const financial = state.cash+state.bank+bagValue-state.debt;
        const achievement = state.fame*100+state.followers*2+state.contacts*350+state.films.length*2000;
        state.final = { bagValue, financial, achievement };
        saveScore({ achievement, financial, age: Math.round(state.age), win: state.win, stage: currentStage().name });
        addLog(win ? "הגעת/הגעה לפרישה — מסלול קריירה שלם." : "המסלול נעצר כאן.");
      }

      function requiredMilestonesMet(stage) { return (stage.milestones||[]).filter((m)=>m.required).every((m)=>m.check(state)); }

      function liquidateIrrelevantBag(nextStage) {
        const nextIds = new Set(((nextStage && nextStage.goods) || []).map((g)=>g.id));
        Object.keys(state.bag).forEach((id) => {
          if (nextIds.has(id)) return;
          const qty = state.bag[id]; const value = sellPrice(id)*qty;
          delete state.bag[id];
          if (value > 0) { state.cash += value; addLog("מומש אוטומטית: "+goodName(id)+" × "+qty+" תמורת "+money(value)+" — לא רלוונטי לשלב הבא."); }
        });
      }

      function applyStageTransition() {
        const stage = currentStage();
        const nextStage = STAGES[stage.order+1];
        liquidateIrrelevantBag(nextStage);
        if (!nextStage) { finish(true); return; }
        state.stageId = nextStage.id; state.stageYear = 0;
        state.nextMilestoneAge = nextStage.ageRange[1];
        state.stageIntroPending = true;
        addLog("עברת לשלב: "+nextStage.name+".");
        const market = generateMarket(nextStage.id);
        state.prices = market.prices; state.priceKinds = market.kinds; state.previousPrices = {...market.prices};
      }

      function offerFallback(stage) {
        notify("השלב לא הושלם כמתוכנן", "היעדים המרכזיים של '"+stage.name+"' לא הושלמו. יש דרך להמשיך בכל זאת:",
          stage.fallbackPaths.map((f)=>({label:f.label, kind:"fallback:"+f.id})));
      }

      function checkStageProgress() {
        if (state.ended || state.event || state.commitment) return false;
        const stage = currentStage();
        if (requiredMilestonesMet(stage)) { applyStageTransition(); return true; }
        if (state.age >= stage.ageRange[1] + STAGE_GRACE_YEARS && stage.fallbackPaths && stage.fallbackPaths.length) { offerFallback(stage); return true; }
        return false;
      }

      function checkBankruptcy() {
        if (state.ended || state.event) return false;
        if (state.debt > (state.cash+state.bank)*8 && state.cash < 100) {
          if (state.bankruptcyStrikes >= BANKRUPTCY_STRIKE_LIMIT) { finish(false); return true; }
          notify("החוב יצא משליטה","הבנקאי דורש הכרעה עכשיו: הלוואת חירום בריבית גבוהה, או לוותר על המסלול כאן.",
            [{label:"הלוואת חירום · +₪2,000",kind:"emergency-loan"},{label:"לוותר על המסלול",kind:"give-up",quiet:true}]);
          return true;
        }
        return false;
      }

      function checkDebtCollector() {
        if (state.ended || state.event) return false;
        if (state.debtCollectorStreak < DEBT_COLLECTOR_YEARS) return false;
        const repeat = state.debtCollectorIgnores > 0;
        const payAmountNow = Math.min(payAmount(), state.cash, state.debt);
        notify("אזהרה מההוצאה לפועל",
          repeat
            ? "זו כבר לא הפעם הראשונה. הבנק פותח נגדך תיק בהוצאה לפועל — עיקולים אפשריים, לא רק מכתב."
            : "שנים בלי לגעת בחוב. הבנק שולח התראה אחרונה לפני פתיחת תיק בהוצאה לפועל — עדיין אפשר למנוע את זה.",
          [
            { label:"לשלם עכשיו · "+money(payAmountNow), kind:"collector-pay" },
            { label:"להתעלם", kind:"collector-ignore", quiet:true }
          ]);
        return true;
      }

      function triggerIncident() {
        if (state.event) return;
        const stage = currentStage();
        const pool = (stage.incidents||[]).concat(UNIVERSAL_INCIDENTS).filter((inc)=>!inc.when || inc.when(state));
        if (!pool.length) return;
        const roll = Math.random();
        let acc = 0;
        for (const inc of pool) { acc += inc.chance; if (roll < acc) { notify(inc.title, inc.copy, inc.choices); return; } }
      }

      function advanceYear(reason, years) {
        const elapsed = Math.max(0.1, Number(years)||1);
        state.age += elapsed; state.stageYear += elapsed; state.year += elapsed;
        const before = state.debt;
        state.debt = Math.ceil(state.debt * Math.pow(DEBT_ANNUAL_RATE, elapsed));
        state.debtCollectorStreak = state.debt > DEBT_COLLECTOR_MIN_DEBT ? state.debtCollectorStreak + elapsed : 0;
        if (state.bank > 0) state.bank = Math.round(state.bank * Math.pow(BANK_ANNUAL_RATE, elapsed));
        state.previousPrices = {...state.prices};
        const market = generateMarket(state.stageId);
        state.prices = market.prices; state.priceKinds = market.kinds;
        const roundedElapsed = Math.round(elapsed*10)/10;
        addLog("גיל "+Math.round(state.age)+": "+reason+(elapsed!==1?" ("+formatDuration(roundedElapsed)+").":""));
        state.lastRecap = { years:roundedElapsed, interestPaid: state.debt-before, age: Math.round(state.age) };
        state.briefPending = true;
        if (checkBankruptcy()) return true;
        if (checkStageProgress()) return true;
        if (checkDebtCollector()) return true;
        if (state.stageId === "festivals") { maybeOfferFlight(); if (state.event) return false; }
        triggerIncident();
        return false;
      }

      function uninvitedCities() {
        return CITIES.filter((c)=>FLIGHT_CITY_IDS.includes(c.id) && !state.achievements["visited-"+c.id]);
      }

      function maybeOfferFlight() {
        if (state.event) return;
        if (Math.random() > 0.3) return;
        const pool = uninvitedCities();
        if (!pool.length) return;
        const cityChoices = pool.map((c)=>({label:"לטוס ל"+c.name+" · "+money(c.fare), kind:"accept-flight", cityId:c.id}));
        notify("הוזמנת לפסטיבל", "יש הזמנה השנה — לאן לטוס? כל טיסה עולה כסף ושנה מהחיים.",
          [...cityChoices, {label:"להישאר ולהפיץ מקומית", kind:"decline-flight", quiet:true}]);
      }

      function acceptFlight(cityId) {
        if (state.ended) return false;
        const city = CITIES.find((c)=>c.id===cityId);
        if (!city) return false;
        if (state.cash < city.fare) { addLog("לא היה מספיק כסף לטיסה ל"+city.name+" — נשארת להפיץ מקומית."); advanceYear("הפצה מקומית במקום טיסה.", 1); save(); render(); return false; }
        state.cash -= city.fare;
        state.achievements["visited-"+city.id] = true;
        state.fame += 3; state.followers += 400; state.contacts += 1;
        addLog("טסת ל"+city.name+" והשתתפת בפסטיבל.");
        advanceYear("פסטיבל ב"+city.name+".", 1);
        save(); render(); return true;
      }

      function declineFlight() {
        if (state.ended) return false;
        addLog("בחרת להישאר ולהפיץ מקומית.");
        advanceYear("הפצה מקומית במקום טיסה.", 1);
        save(); render(); return true;
      }

      function progressCommitment() {
        const config = currentCommitmentConfig(state);
        if (!config || !state.commitment) return;
        const next = config.checkpoints.find((c)=>!state.commitment.resolvedCheckpoints.includes(c.id));
        const targetYear = next ? next.atYear : config.years;
        const years = Math.max(0, targetYear - state.commitment.elapsedYears);
        state.commitment.elapsedYears = targetYear;
        if (years > 0) { const ended = advanceYear(config.name+" ממשיכה.", years); if (ended || state.ended || state.event) return; }
        if (next) { state.activeCheckpoint = { commitmentId:config.id, checkpointId:next.id }; notify(next.title, next.copy, next.choices, typeof next.html==="function" ? next.html(state) : next.html); return; }
        completeCommitment(config);
      }

      function completeCommitment(config) {
        if (config.grantsOnComplete && config.grantsOnComplete.fame) state.fame += config.grantsOnComplete.fame;
        if (config.id === "filmSchool") state.assets.diploma = true;
        if (config.id === "indieFilm" || config.id === "legacyFilm") {
          const draft = state.filmDraft || {};
          state.films.push({
            title: draft.title || (config.id==="indieFilm" ? "הסרט העצמאי הראשון" : "הסרט האישי האחרון"),
            genre: draft.genre || "דרמה",
            starring: draft.starName || "קובי",
            completedAge: Math.round(state.age)
          });
          state.filmDraft = {};
          pushAward(config.id==="indieFilm" ? "סיום: הסרט העצמאי הראשון" : "סיום: הסרט האישי האחרון");
        }
        if (config.id === "rabinovichGrant") { state.films.push({ title:"הסרט העצמאי — מענק ציבורי", completedAge: Math.round(state.age) }); pushAward("סיום סרט במימון קרן ציבורית"); }
        state.pathTags.push(config.id);
        addLog("סיימת: "+config.name+".");
        state.commitment = null;
        checkStageProgress();
      }

      function startCommitment(id) {
        if (state.ended || state.event || state.commitment) return false;
        const config = (currentStage().commitments||[]).find((c)=>c.id===id);
        if (!config) return false;
        state.stageIntroPending = false;
        if (config.entryDebt) { state.debt += config.entryDebt; addLog("נכנסת ל"+config.name+" — החוב עלה ב-"+money(config.entryDebt)+"."); }
        if (config.immediateEffect) config.immediateEffect(state);
        if (!config.years) {
          state.pathTags.push(config.id);
          addLog("בחרת: "+config.name+".");
          checkStageProgress();
          save(); render(); return true;
        }
        state.commitment = { id:config.id, elapsedYears:0, totalYears:config.years, resolvedCheckpoints:[] };
        addLog("התחלת: "+config.name+".");
        progressCommitment();
        save(); render(); return true;
      }

      function openView(view) { if (state.ended||state.event) return false; state.view = view; save(); render(); return true; }

      function buy(id) {
        if (state.ended||state.event) return false;
        const good = currentStage().goods.find((g)=>g.id===id);
        if (!good) return false;
        const price = state.prices[id];
        if (price == null) return announce("לא זמין השנה","הפריט הזה לא נמכר השנה. נסה שוב מאוחר יותר.");
        if (good.persistsAsAsset) {
          if (state.assets[id]) return announce("כבר יש לך את זה","זה נכס קבוע — אין צורך בעוד אחד.");
          if (state.cash < price) return announce("אין מספיק מזומן","חסרים "+money(price-state.cash)+" לקנייה הזאת.");
          state.cash -= price; state.assets[id] = true;
          addLog("קנית "+good.name+" ב-"+money(price)+" — נכס קבוע.");
          save(); render(); return true;
        }
        if (bagCount() >= state.capacity) return announce("התיק מלא","מכור סחורה כדי לפנות מקום.");
        if (state.cash < price) return announce("אין מספיק מזומן","חסרים "+money(price-state.cash)+" לקנייה הזאת.");
        state.cash -= price; state.bag[id] = (state.bag[id]||0)+1;
        addLog("קנית "+good.name+" ב-"+money(price)+".");
        save(); render(); return true;
      }

      function sell(id) {
        if (state.ended||state.event||!has(id)) return false;
        const price = sellPrice(id);
        remove(id); state.cash += price;
        addLog("מכרת "+goodName(id)+" ב-"+money(price)+"."); save(); render(); return true;
      }

      function openGigForecast(id) {
        if (state.ended||state.event||state.commitment||state.briefPending||state.pendingAction) return false;
        const gig = (currentStage().gigs||[]).find((g)=>g.id===id);
        if (!gig) return false;
        const lack = missing(gig.needs);
        if (lack.length) return announce("חסר ציוד לעבודה הזאת","צריך: "+lack.join(" · ")+".");
        state.pendingAction = { kind:"gig", id };
        save(); render(); return true;
      }

      function confirmGig() {
        if (!state.pendingAction || state.pendingAction.kind!=="gig") return false;
        const id = state.pendingAction.id;
        state.pendingAction = null;
        return doGig(id);
      }

      function cancelPendingAction() { state.pendingAction = null; save(); render(); return true; }

      function doGig(id) {
        if (state.ended||state.event||state.commitment) return false;
        const gig = (currentStage().gigs||[]).find((g)=>g.id===id);
        if (!gig) return false;
        const lack = missing(gig.needs);
        if (lack.length) return announce("חסר ציוד לעבודה הזאת","צריך: "+lack.join(" · ")+".");
        state.cash += gig.cash; state.fame += (gig.fame||0); state.contacts += (gig.contacts||0); state.followers += (gig.followers||0);
        advanceYear("עבדת כ"+gig.title+".", GIG_YEARS);
        save(); render(); return true;
      }

      function payAmount() { return Math.max(500, Math.round(state.debt*0.1)); }

      function bank(action) {
        if (state.ended||state.event) return false;
        const amount = 500;
        if (action==="pay") { const paid=Math.min(payAmount(),state.cash,state.debt); if (!paid) return announce("אין מה להחזיר","צריך מזומן כדי להקטין את החוב."); state.cash-=paid; state.debt-=paid; state.debtCollectorStreak=0; state.debtCollectorIgnores=0; addLog("החזרת "+money(paid)+" מהחוב."); }
        if (action==="payAll") {
          if (!state.debt) return announce("אין חוב להחזיר","החוב כבר עומד על אפס.");
          if (state.cash < state.debt) return announce("אין מספיק מזומן","צריך "+money(state.debt-state.cash)+" נוספים כדי לסגור את כל החוב בבת אחת.");
          const paidAll = state.debt; state.cash -= paidAll; state.debt = 0;
          state.debtCollectorStreak=0; state.debtCollectorIgnores=0;
          addLog("סגרת את כל החוב בבת אחת — "+money(paidAll)+".");
        }
        if (action==="deposit") { if (state.cash<amount) return announce("אין מספיק מזומן","צריך "+money(amount)+" כדי להפקיד."); state.cash-=amount; state.bank+=amount; addLog("הפקדת "+money(amount)+" בבנק."); }
        if (action==="withdraw") { const drawn=Math.min(amount,state.bank); if (!drawn) return announce("אין פיקדון למשוך","עדיין לא הופקד כסף בבנק."); state.bank-=drawn; state.cash+=drawn; addLog("משכת "+money(drawn)+" מהבנק."); }
        save(); render(); return true;
      }

      function setMarketTab(tab) {
        if (state.ended||state.event) return false;
        if (!MARKET_TABS.some((t)=>t.id===tab)) return false;
        state.marketTab = tab;
        save(); render(); return true;
      }

      function takeBlackMarketLoan() {
        if (state.ended||state.event) return false;
        state.cash += BLACK_MARKET_LOAN.cash;
        state.debt += BLACK_MARKET_LOAN.debt;
        addLog("לקחת הלוואת חוץ-בנקאית — "+money(BLACK_MARKET_LOAN.cash)+" מזומן תמורת "+money(BLACK_MARKET_LOAN.debt)+" חוב.");
        save(); render(); return true;
      }

      function takeCheapGear() {
        const stage = currentStage();
        const affordable = stage.goods.filter((g)=> state.prices[g.id]!=null && (!g.persistsAsAsset || !state.assets[g.id]));
        if (!affordable.length) { addLog("לא נמצא ציוד מתאים להזדמנות."); return; }
        const good = affordable[0];
        const price = round5(state.prices[good.id]*.5);
        if (state.cash < price) { addLog("לא היה מספיק מזומן לתפוס את ההזדמנות."); return; }
        state.cash -= price;
        if (good.persistsAsAsset) state.assets[good.id]=true; else state.bag[good.id]=(state.bag[good.id]||0)+1;
        addLog("תפסת הזדמנות: "+good.name+" ב-"+money(price)+".");
      }

      function resolveEvent(index) {
        if (!state.event) return false;
        const choice = state.event.choices[index];
        const checkpointRef = state.activeCheckpoint;
        state.event = null; state.activeCheckpoint = null;
        if (!choice) return false;

        if (checkpointRef) {
          state.pathTags.push(choice.kind);
          if (choice.effect) choice.effect(state);
          state.commitment.resolvedCheckpoints.push(checkpointRef.checkpointId);
          addLog("החלטה: "+choice.label+".");
          progressCommitment();
          save(); render(); return true;
        }
        if (choice.kind && choice.kind.indexOf("fallback:") === 0) {
          const fb = currentStage().fallbackPaths.find((f)=>choice.kind==="fallback:"+f.id);
          if (fb) { fb.effect(state); addLog("מסלול חלופי: "+fb.label+"."); }
          applyStageTransition();
          save(); render(); return true;
        }

        if (choice.kind === "repair") {
          if (state.cash < 300) { notify("אין מספיק מזומן","אין כרגע כסף לתיקון.",[{label:"להמשיך",kind:"pass"}]); render(); return false; }
          state.cash -= 300; addLog("תיקנת את המצלמה ב-₪300.");
        } else if (choice.kind === "risk-camera") { addLog("המשכת עם הסיכון על המצלמה."); }
        else if (choice.kind === "scramble") { state.cash -= 300; addLog("מצאת תחליף מהיר, בעלות."); }
        else if (choice.kind === "cheap-gear-take") { takeCheapGear(); }
        else if (choice.kind === "debt-pay") { const amt=Math.min(500,state.cash,state.debt); state.cash-=amt; state.debt-=amt; addLog("החזרת "+money(amt)+" מהחוב."); }
        else if (choice.kind === "debt-delay") { state.debt += 300; addLog("דחית את הבנק והחוב גדל."); }
        else if (choice.kind === "road-gig") { state.cash += 600; state.contacts += 1; advanceYear("עבודה ספונטנית בדרך.", 1); }
        else if (choice.kind === "emergency-loan") { state.cash += 2000; state.debt = Math.ceil((state.debt+2000)*1.10); state.bankruptcyStrikes += 1; addLog("לקחת הלוואת חירום — החוב גדל משמעותית."); }
        else if (choice.kind === "give-up") { finish(false); }
        else if (choice.kind === "collector-pay") {
          const paid = Math.min(payAmount(), state.cash, state.debt);
          state.cash -= paid; state.debt -= paid; state.debtCollectorStreak = 0; state.debtCollectorIgnores = 0;
          addLog(paid ? "שילמת "+money(paid)+" — התיק בהוצאה לפועל נסגר, לעת עתה." : "לא היה לך מה לשלם — התיק עדיין פתוח, אבל לא לנצח.");
        }
        else if (choice.kind === "collector-ignore") {
          const penalty = Math.ceil(state.debt*0.05);
          state.debt += penalty; state.debtCollectorStreak = 0; state.debtCollectorIgnores += 1;
          if (state.debtCollectorIgnores >= 2) { state.bankruptcyStrikes += 1; addLog("התעלמת שוב — התיק בהוצאה לפועל נפתח, החוב גדל ב-"+money(penalty)+", וזה כבר מתחיל להיראות כמו פשיטת רגל."); }
          else { addLog("התעלמת מההתראה — החוב גדל ב-"+money(penalty)+"."); }
        }
        else if (choice.kind === "accept-flight") { return acceptFlight(choice.cityId); }
        else if (choice.kind === "decline-flight") { return declineFlight(); }
        else if (choice.kind === "clap-back") { state.followers += 2000; state.fame += 2; addLog("ענית בראיון חריף — הסערה רק הגדילה את החשיפה."); pushAward("פרס על אף המחלוקת"); }
        else if (choice.kind === "stay-quiet") { state.fame += 3; addLog("שתקת ונתת לסרט לדבר בעצמו."); pushAward("פרס על אף המחלוקת"); }

        if (state.commitment && !state.event && !state.ended) progressCommitment();
        save(); render(); return true;
      }

      function row(title,copy,meta,action,label,disabled) { return `<article class="action-row"><div><h3>${title}</h3><p>${copy}</p></div><div class="action-meta"><b>${meta}</b><button class="row-action" data-action="${action}" ${disabled?"disabled":""}>${label}</button></div></article>`; }

      function trendBadge(id) {
        const kind = state.priceKinds && state.priceKinds[id];
        if (kind==="crash") return ' <small class="trend-down">↓ מבצע</small>';
        if (kind==="spike") return ' <small class="trend-up">↑ ביקוש</small>';
        return "";
      }

      function workRows() {
        const stage = currentStage();
        let html = "";
        if (!hasChosenEntryPath() && stage.commitments && stage.commitments.length) {
          html += stage.commitments.map((c)=> row(c.name, c.copy+(c.entryDebt?" · חוב +"+money(c.entryDebt):" · בלי חוב"), c.years?c.years+" שנים":"מיידי", "commit:"+c.id, "לבחור")).join("");
        }
        if (state.commitment) {
          const config = currentCommitmentConfig(state);
          html += `<article class="action-row"><div><h3>${config.name}</h3><p>בעיצומה · שנה ${Math.round(state.commitment.elapsedYears)} מתוך ${config.years}</p></div><div class="action-meta"><b>בתהליך</b></div></article>`;
        } else {
          const gigRow = (gig) => {
            const lack = missing(gig.needs);
            const meta = "+"+money(gig.cash)+(gig.fame?" · +"+gig.fame+" הכרה":"");
            return row(gig.title, gig.copy+(lack.length?" · חסר: "+lack.join(" · "):""), meta, "gig:"+gig.id, lack.length?"חסר ציוד":"לעבוד");
          };
          const careerGigs = (stage.gigs||[]).filter((g)=>g.fame>0||g.contacts>0);
          const survivalGigs = (stage.gigs||[]).filter((g)=>!(g.fame>0||g.contacts>0));
          if (survivalGigs.length) html += `<p class="eyebrow" style="margin-top:12px">עבודות הישרדות · כסף מהיר</p>` + survivalGigs.map(gigRow).join("");
          if (careerGigs.length) html += `<p class="eyebrow" style="margin-top:12px">עבודות קריירה · הכרה וקשרים</p>` + careerGigs.map(gigRow).join("");
        }
        return html || '<p class="empty">אין כרגע עבודות זמינות בשלב הזה.</p>';
      }

      function goodRow(good) {
        const price = state.prices[good.id];
        const unavailable = price == null;
        const already = good.persistsAsAsset && state.assets[good.id];
        const owned = good.persistsAsAsset ? (already?1:0) : (state.bag[good.id]||0);
        const kindLabel = good.persistsAsAsset ? "נכס קבוע" : good.market==="deal" ? ("עסקה · בתיק: "+owned) : ("יד שנייה · בתיק: "+owned);
        return `<article class="action-row"><div><h3>${good.name}${trendBadge(good.id)}</h3><p>${kindLabel}</p></div><div class="action-meta"><b>${unavailable?"לא זמין":(already?"נרכש":money(price))}</b><span><button class="row-action" data-action="buy" data-id="${good.id}" ${unavailable||already?"disabled":""}>קנה</button> ${good.persistsAsAsset ? "" : `<button class="row-action quiet" data-action="sell" data-id="${good.id}" ${owned?"":"disabled"}>מכור</button>`}</span></div></article>`;
      }

      function shopRows() {
        const goods = (currentStage().goods||[]).filter((g)=>g.persistsAsAsset);
        return goods.length ? goods.map(goodRow).join("") : '<p class="empty">אין עדיין ציוד חדש למכירה בשלב הזה.</p>';
      }

      function secondhandRows() {
        const goods = (currentStage().goods||[]).filter((g)=>!g.persistsAsAsset && g.market!=="deal");
        return goods.length ? goods.map(goodRow).join("") : '<p class="empty">אין עדיין פריטים בשוק היד-שנייה בשלב הזה.</p>';
      }

      function dealRows() {
        const goods = (currentStage().goods||[]).filter((g)=>!g.persistsAsAsset && g.market==="deal");
        return goods.length ? goods.map(goodRow).join("") : '<p class="empty">אין עדיין עסקאות זמינות בשלב הזה.</p>';
      }

      function bankRows() {
        const hasDebt = state.debt > 0;
        let html = row("להחזיר חוב","10% מהחוב הנוכחי — כל תשלום מקטין גם את הריבית הבאה",money(payAmount()),"bank:pay","להחזיר",!hasDebt);
        if (hasDebt) {
          html += row("לסגור את כל החוב","תשלום חד-פעמי של מלוא היתרה בבת אחת",money(state.debt),"bank:payAll","לסגור הכל",state.cash<state.debt);
        }
        html += row("להפקיד","שומר כסף בצד · צובר ריבית 1.5% לשנה",money(500),"bank:deposit","להפקיד")
          + row("למשוך פיקדון","כרגע בבנק: "+money(state.bank),money(500),"bank:withdraw","למשוך");
        return html;
      }

      function blackMarketRows() {
        return row("הלוואת חוץ-בנקאית","מזומן מהיר עכשיו, בלי שאלות — אבל תוספת חוב הרבה יותר כבדה מהבנק",
          "+"+money(BLACK_MARKET_LOAN.cash)+" · חוב +"+money(BLACK_MARKET_LOAN.debt),"loanshark","לקחת הלוואה");
      }

      function financingRows() {
        return `<p class="eyebrow">בנק</p>${bankRows()}<p class="eyebrow" style="margin-top:16px">שוק שחור</p>${blackMarketRows()}`;
      }

      const MARKET_TABS = [
        { id:"work", label:"עבודה" },
        { id:"shop", label:"חנות" },
        { id:"secondhand", label:"יד שנייה" },
        { id:"deals", label:"עסקאות" },
        { id:"financing", label:"מימון" }
      ];

      function marketTabsMarkup() {
        const active = state.marketTab || "work";
        return `<nav class="market-tabs" role="tablist" aria-label="שוק">${MARKET_TABS.map((t)=>
          `<button class="market-tab ${t.id===active?"active":""}" role="tab" aria-selected="${t.id===active}" data-action="tab:${t.id}">${t.label}</button>`
        ).join("")}</nav>`;
      }

      function marketBody() {
        const tab = state.marketTab || "work";
        if (tab==="shop") return shopRows();
        if (tab==="secondhand") return secondhandRows();
        if (tab==="deals") return dealRows();
        if (tab==="financing") return financingRows();
        return workRows();
      }

      function actionAttr(action) {
        if (!action) return "";
        if (action.type==="gig") return "gig:"+action.id;
        if (action.type==="commitment") return "commit:"+action.id;
        return "";
      }

      function stageTrackMarkup() {
        const stage = currentStage();
        return `<nav class="stage-track" aria-label="מסלול קריירה">${STAGES.map((s)=>{
          const cls = s.order<stage.order ? "done" : s.order===stage.order ? "current" : "locked";
          return `<span class="stage-node ${cls}">${s.order<stage.order?"✓ ":""}${s.name}</span>`;
        }).join("")}</nav>`;
      }

      function progressBarMarkup(m) {
        const p = m.progress(state);
        const pct = Math.max(0, Math.min(100, Math.round((p.current/p.target)*100)));
        const fmt = (n) => Math.round(n).toLocaleString("he-IL");
        return `<div class="milestone-progress ${pct>=100?"done":""}"><div class="progress-label"><span>${pct>=100?"✓ ":""}${m.label}</span><span>${fmt(p.current)} / ${fmt(p.target)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div></div>`;
      }
      function goalPanelMarkup(stage) {
        const milestones = stage.milestones||[];
        const bars = milestones.filter((m)=>m.required && m.progress).map(progressBarMarkup).join("");
        const chips = milestones.filter((m)=>!m.required).map((m)=>`<span class="milestone ${m.check(state)?"done":""}">${m.check(state)?"✓ ":""}${m.label}</span>`).join("");
        const empty = !bars && !chips ? '<span class="milestone">אין עדיין יעדים מוגדרים</span>' : "";
        return `<div class="next-move"><div><small>המטרה הנוכחית · ${stage.name} (${stage.ageRange[0]}–${stage.ageRange[1]})</small><b>${stage.headline}</b>${bars}${chips?`<div class="milestone-list">${chips}</div>`:""}${empty}</div></div>`;
      }

      function recommendPanelMarkup(stage) {
        const rec = stage.recommend(state);
        const alts = (rec.alternatives||[]).slice(0,2).map((a)=>`<button class="row-action quiet" data-action="${actionAttr(a)}">${a.label}</button>`).join(" ");
        return `<div class="next-move"><div><small>המהלך המוצע</small><b>${rec.title}</b><span>${rec.copy}</span></div><div class="recommend-actions">${rec.action?`<button class="primary" data-action="${actionAttr(rec.action)}">${rec.actionLabel||"לבצע"}</button>`:""}${alts}</div></div>`;
      }

      function recapMarkup() {
        if (!state.lastRecap) return "";
        const r = state.lastRecap;
        return `<div class="final-grid recap"><div><small>גיל</small><b>${r.age}</b></div><div><small>החוב גדל ב</small><b>${money(r.interestPaid)}</b></div><div><small>משך</small><b>${formatDuration(r.years)}</b></div></div>`;
      }

      function stageIntroMarkup() {
        const stage = currentStage();
        const milestoneChips = (stage.milestones||[]).filter((m)=>m.required).map((m)=>`<span class="milestone required">${m.label}</span>`).join("");
        const showCommitments = !hasChosenEntryPath() && stage.commitments && stage.commitments.length;
        const commitButtons = showCommitments ? stage.commitments.map((c)=>
          `<button class="primary" data-action="commit:${c.id}">${c.name} · ${c.years?c.years+" שנים":"מיידי"}${c.entryDebt?" · חוב +"+money(c.entryDebt):" · בלי חוב"}</button>`
        ).join("") : "";
        return `<section class="event intro"><span>שלב חדש</span><h2>${stage.name}</h2>
          <p>${stage.headline}</p>
          ${milestoneChips?`<div class="milestone-list">${milestoneChips}</div>`:""}
          ${commitButtons?`<p class="eyebrow" style="margin-top:14px">בחירת מסלול כניסה</p>${commitButtons}`:""}
          <button class="quiet" data-action="stage-intro:close">${showCommitments?"אחליט אחר כך":"להתחיל ←"}</button>
        </section>`;
      }

      function briefMarkup() {
        const stage = currentStage();
        return `<section class="event brief"><span>עדכון</span><h2>גיל ${Math.round(state.age)}</h2>
          ${recapMarkup()}
          ${recommendPanelMarkup(stage)}
          <button class="quiet" data-action="brief:close">המשך ←</button>
        </section>`;
      }

      function gigForecastMarkup() {
        const gig = (currentStage().gigs||[]).find((g)=>g.id===state.pendingAction.id);
        if (!gig) return "";
        const chips = [
          `<span class="milestone">+${money(gig.cash)}</span>`,
          gig.fame ? `<span class="milestone">+${gig.fame} הכרה</span>` : "",
          gig.contacts ? `<span class="milestone">+${gig.contacts} קשרים</span>` : "",
          gig.followers ? `<span class="milestone">+${gig.followers.toLocaleString("he-IL")} עוקבים</span>` : ""
        ].filter(Boolean).join("");
        return `<section class="event forecast"><span>לפני שממשיכים</span><h2>${gig.title}</h2>
          <p>${gig.copy}</p>
          <div class="milestone-list">${chips}</div>
          <button class="primary" data-action="gig-confirm">לבצע ←</button>
          <button class="quiet" data-action="gig-cancel">ביטול</button>
        </section>`;
      }

      function hudView() {
        const stage = currentStage();
        return `<section class="panel">
          ${goalPanelMarkup(stage)}
          ${recommendPanelMarkup(stage)}
          ${recapMarkup()}
          ${marketTabsMarkup()}
          <div class="service-list">${marketBody()}</div>
          <div class="footer-actions"><button data-action="finish">לוותר על המסלול</button><button data-action="log">יומן קריירה</button><button data-action="bag">תיק הפקה</button></div>
        </section>`;
      }

      function logView() {
        const rows = state.log.map((line)=>`<div class="bag-item"><span>${line}</span></div>`).join("");
        return `<section class="panel bag"><header class="service-top"><div><p class="eyebrow">היסטוריה</p><h1>יומן קריירה</h1></div><button class="back" data-action="hud">חזרה ←</button></header>
          <div class="bag-grid" style="grid-template-columns:1fr">${rows||'<p class="empty">עוד אין רשומות.</p>'}</div>
          <div class="footer-actions"><button data-action="finish">לוותר על המסלול</button><button data-action="hud">למסך הראשי</button></div></section>`;
      }

      function bagView() {
        const bagRows = Object.keys(state.bag).filter((id)=>state.bag[id]).map((id)=>`<div class="bag-item"><span>${goodName(id)}</span><b>×${state.bag[id]}</b></div>`).join("");
        const assetRows = Object.keys(state.assets).filter((id)=>state.assets[id] && id!=="diploma").map((id)=>`<div class="bag-item"><span>${assetName(id)}</span><b>נכס</b></div>`).join("") + (state.assets.diploma ? `<div class="bag-item"><span>תעודת לימודי קולנוע</span><b>נכס</b></div>` : "");
        return `<section class="panel bag"><header class="service-top"><div><p class="eyebrow">ציוד ונכסים</p><h1>תיק הפקה</h1></div><button class="back" data-action="hud">חזרה ←</button></header>
          <p class="eyebrow">בתיק (סחורה זמנית)</p>
          <div class="bag-grid">${bagRows||'<p class="empty">התיק ריק.</p>'}</div>
          <p class="eyebrow" style="margin-top:14px">נכסים קבועים</p>
          <div class="bag-grid">${assetRows||'<p class="empty">עוד אין נכסים קבועים.</p>'}</div>
          <div class="footer-actions"><button data-action="finish">לוותר על המסלול</button><button data-action="hud">למסך הראשי</button></div></section>`;
      }

      function renderModal() {
        if (!modal) return;
        if (state.ended) {
          const final = state.final || {financial:0, achievement:0};
          const scores = loadScores();
          const scoreRows = scores.map((s,i)=>`<div class="bag-item"><span>#${i+1} · ${s.stage} · גיל ${s.age}${s.win?" · ניצחון":""}</span><b>${money(s.achievement)}</b></div>`).join("");
          const awardRows = state.awards.map((a)=>`<div class="bag-item"><span>${a.title} · ${a.stage}, גיל ${a.age}</span><b>🏆</b></div>`).join("");
          modal.classList.remove("hidden");
          modal.innerHTML = `<section class="event"><span>${state.win?"סוף דרך — פרישה":"המסלול נעצר"}</span><h2>${state.win?"קובי הגיע/ה לפרישה אחרי קריירה שלמה.":"המסלול נעצר כאן."}</h2><p>${state.win?"עברת את כל שלבי הקריירה — מסטודנט/ית ועד פרישה.":"אפשר להתחיל מחדש עם הידע שצברת."}</p><div class="final-grid" style="grid-template-columns:repeat(2,1fr)"><div><small>הישג מקצועי</small><b>${money(final.achievement)}</b></div><div><small>מצב כלכלי</small><b>${money(final.financial)}</b></div><div><small>גיל</small><b>${Math.round(state.age)}</b></div><div><small>שלב</small><b>${currentStage().name}</b></div></div>${awardRows?`<p class="eyebrow" style="margin-top:14px">ארון פרסים</p><div class="bag-grid" style="grid-template-columns:1fr">${awardRows}</div>`:""}<p class="eyebrow" style="margin-top:14px">שיאים</p><div class="bag-grid" style="grid-template-columns:1fr">${scoreRows||'<p class="empty">עדיין אין שיאים.</p>'}</div><button data-action="new">מסלול חדש ←</button></section>`;
          return;
        }
        if (state.pendingAction) {
          modal.classList.remove("hidden");
          modal.innerHTML = state.pendingAction.kind==="gig" ? gigForecastMarkup() : "";
          return;
        }
        if (state.briefPending && state.lastRecap) {
          modal.classList.remove("hidden");
          modal.innerHTML = briefMarkup();
          return;
        }
        if (state.stageIntroPending) {
          modal.classList.remove("hidden");
          modal.innerHTML = stageIntroMarkup();
          return;
        }
        if (!state.event) { modal.classList.add("hidden"); modal.innerHTML=""; return; }
        modal.classList.remove("hidden");
        modal.innerHTML = `<section class="event"><span>אירוע</span><h2>${state.event.title}</h2>${state.event.html || `<p>${state.event.copy}</p>`}<div class="event-options">${state.event.choices.map((c,i)=>`<button class="${c.quiet?"quiet":""}" data-action="event" data-id="${i}">${c.label}</button>`).join("")}</div></section>`;
      }

      function render() {
        if (!app) return;
        const head = `<header class="topbar"><div class="brand">KOBI / קריירה</div><div class="turn"><div>גיל<b>${Math.round(state.age)}</b></div><div>שנה<b>${Math.round(state.year)}</b></div><div>מזומן<b>${money(state.cash)}</b></div><div class="debt">חוב<b>${money(state.debt)}</b>${state.debt>0?'<button class="mini-pay" data-action="bank:pay">להחזיר</button>':""}</div><div class="fame">קרדיטים<b>${state.fame}</b></div><div class="followers">עוקבים<b>${state.followers.toLocaleString("he-IL")}</b></div><div class="contacts">קשרים<b>${state.contacts}</b></div><div>תיק<b>${bagCount()} / ${state.capacity}</b></div></div></header>${stageTrackMarkup()}`;
        const body = state.view==="bag" ? bagView() : state.view==="log" ? logView() : hudView();
        app.innerHTML = `<div class="shell">${head}${body}</div>`;
        renderModal();
      }

      function bindEvents() {
        document.addEventListener("click", (event) => {
          const button = event.target.closest("[data-action]"); if (!button) return;
          const action = button.dataset.action, id = button.dataset.id;
          if (action==="hud") openView("hud");
          if (action==="bag") openView("bag");
          if (action==="log") openView("log");
          if (action==="buy") buy(id);
          if (action==="sell") sell(id);
          if (action.indexOf("gig:")===0) openGigForecast(action.slice(4));
          if (action.indexOf("commit:")===0) startCommitment(action.slice(7));
          if (action.indexOf("bank:")===0) bank(action.slice(5));
          if (action.indexOf("tab:")===0) setMarketTab(action.slice(4));
          if (action==="loanshark") takeBlackMarketLoan();
          if (action==="event") resolveEvent(Number(id));
          if (action==="brief:close") closeBrief();
          if (action==="stage-intro:close") closeStageIntro();
          if (action==="gig-confirm") confirmGig();
          if (action==="gig-cancel") cancelPendingAction();
          if (action==="finish") { finish(false); save(); render(); }
          if (action==="new") { state = createState(); save(); render(); }
        });
      }

      if (app) { load(); render(); bindEvents(); }

      globalThis.kobiFilmTrader = {
        getState: () => clone(state),
        newGame: () => { state = createState(); return clone(state); },
        openView, buy, sell, doGig, startCommitment, resolveEvent, bank, acceptFlight, declineFlight,
        setMarketTab, takeBlackMarketLoan, closeBrief,
        openGigForecast, confirmGig, cancelPendingAction, closeStageIntro, loadScores,
        finish: () => { finish(false); return clone(state); },
        STAGES, CITIES,
        __testJumpToStage: (id) => {
          const stage = STAGES.find((s)=>s.id===id) || STAGES[0];
          state.stageId = stage.id; state.stageYear = 0; state.commitment = null; state.activeCheckpoint = null;
          if (stage.ageRange) state.age = stage.ageRange[0];
          const market = generateMarket(stage.id);
          state.prices = market.prices; state.priceKinds = market.kinds; state.previousPrices = {...market.prices};
          return clone(state);
        },
        __testSetState: (patch) => { Object.assign(state, patch); return clone(state); }
      };
    })();
  </script>
</body>
</html>
