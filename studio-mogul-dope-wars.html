<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#070a11">
  <title>KOBI / FIRST CUT</title>
  <style>
    :root {
      --ink:#090c0a; --panel:#101711; --panel-2:#151d14; --line:#40513b;
      --cream:#e8eadc; --muted:#94a08e; --green:#b6df68; --amber:#f0bd58;
      --rose:#e47675; --cyan:#78cfc5; --mono:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,"Liberation Mono",monospace;
    }
    * { box-sizing:border-box; }
    body { min-width:320px; min-height:100vh; margin:0; color:var(--cream); background:radial-gradient(900px 530px at 80% -10%,#243528 0%,transparent 66%),var(--ink); font-family:var(--mono); }
    button { font:inherit; }
    button:focus-visible { outline:2px solid var(--amber); outline-offset:3px; }
    .shell { width:min(1160px,calc(100% - 32px)); margin:0 auto; padding:24px 0 38px; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:18px; padding:0 0 15px; border-bottom:1px solid var(--line); }
    .brand { color:var(--green); font-weight:900; font-size:clamp(1rem,2.3vw,1.3rem); letter-spacing:.12em; }
    .brand b { color:var(--amber); }
    .turn { display:flex; align-items:baseline; gap:10px; text-align:left; }
    .turn span { color:var(--muted); font-size:.72rem; letter-spacing:.08em; }
    .turn strong { color:var(--amber); font-size:1.28rem; }
    .headline { display:flex; align-items:end; justify-content:space-between; gap:16px; padding:24px 0 18px; }
    .eyebrow { margin:0 0 7px; color:var(--green); font-size:.72rem; font-weight:900; letter-spacing:.1em; }
    h1 { margin:0; font-size:clamp(1.75rem,4vw,3.1rem); letter-spacing:-.075em; line-height:.95; }
    .headline p { max-width:37ch; margin:0; color:var(--muted); font-size:.8rem; line-height:1.55; text-align:left; }
    .command { display:grid; grid-template-columns:1.15fr .85fr; gap:12px; margin-bottom:12px; }
    .panel { position:relative; overflow:hidden; border:1px solid var(--line); background:linear-gradient(145deg,rgba(21,29,20,.96),rgba(9,12,10,.96)); box-shadow:0 14px 35px rgba(0,0,0,.2); }
    .panel::before { content:""; position:absolute; inset:0; pointer-events:none; opacity:.18; background:repeating-linear-gradient(0deg,transparent 0,transparent 3px,rgba(182,223,104,.08) 4px); }
    .mission { display:flex; align-items:center; gap:13px; min-height:96px; padding:16px; }
    .mission-mark { display:grid; place-items:center; flex:0 0 34px; width:34px; height:34px; color:var(--ink); background:var(--amber); font-weight:900; transform:rotate(45deg); }
    .mission-mark b { transform:rotate(-45deg); }
    .mission span,.finance label,.market-kicker { color:var(--muted); font-size:.67rem; font-weight:800; letter-spacing:.09em; }
    .mission strong { display:block; margin-top:3px; color:var(--cream); font-size:1rem; }
    .mission p { margin:3px 0 0; color:var(--muted); font-size:.76rem; line-height:1.4; }
    .finance { display:grid; grid-template-columns:repeat(3,1fr); min-height:96px; }
    .finance div { display:grid; align-content:center; gap:5px; padding:12px 14px; border-inline-start:1px solid var(--line); }
    .finance div:first-child { border:0; }
    .finance b { direction:ltr; color:var(--cream); font-size:1rem; }
    .finance .debt b { color:var(--rose); }
    .finance .slots b { color:var(--cyan); }
    .grid { display:grid; grid-template-columns:minmax(0,1fr) 278px; gap:12px; }
    .market { min-height:470px; padding:18px; }
    .market-head { display:flex; align-items:end; justify-content:space-between; gap:16px; margin-bottom:12px; padding-bottom:12px; border-bottom:1px solid var(--line); }
    .market-head h2 { margin:4px 0 0; color:var(--cream); font-size:1.35rem; }
    .market-head p { margin:0; color:var(--muted); font-size:.72rem; text-align:left; }
    .goods { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:8px; }
    .good { display:grid; grid-template-columns:1fr auto; gap:9px; padding:12px; border:1px solid rgba(148,160,142,.26); background:rgba(255,255,255,.018); }
    .good:hover { border-color:var(--green); }
    .good-top { display:flex; align-items:start; justify-content:space-between; gap:8px; }
    .good-title { color:var(--cream); font-weight:900; font-size:.89rem; }
    .good-owned { color:var(--cyan); font-size:.68rem; white-space:nowrap; }
    .good-note { margin:5px 0 0; color:var(--muted); font-size:.68rem; line-height:1.35; }
    .price { direction:ltr; align-self:center; color:var(--amber); font-weight:900; font-size:1.08rem; }
    .deal-actions { display:flex; gap:5px; grid-column:1/-1; }
    .deal-actions button,.travel button,.debt-control button,.footer-actions button,.event button { min-height:31px; padding:6px 9px; cursor:pointer; color:var(--cream); background:#192119; border:1px solid var(--line); font-size:.72rem; font-weight:800; }
    .deal-actions button:hover,.travel button:hover,.debt-control button:hover,.footer-actions button:hover,.event button:hover { color:var(--ink); background:var(--green); border-color:var(--green); }
    .deal-actions button:disabled { cursor:not-allowed; opacity:.36; }
    .deal-actions .sell { color:var(--amber); }
    .deal-actions .sell:hover { background:var(--amber); border-color:var(--amber); }
    .rail { display:grid; align-content:start; gap:12px; }
    .rail .panel { padding:15px; }
    .rail h2 { margin:0 0 12px; color:var(--cream); font-size:.95rem; }
    .travel { display:grid; gap:6px; }
    .travel button { display:flex; align-items:center; justify-content:space-between; width:100%; text-align:right; }
    .travel button.current { cursor:default; color:var(--green); border-color:var(--green); background:rgba(182,223,104,.08); }
    .travel button.current:hover { color:var(--green); background:rgba(182,223,104,.08); }
    .travel small { color:var(--muted); font-size:.63rem; }
    .bag { display:grid; gap:7px; }
    .bag-row { display:flex; justify-content:space-between; gap:9px; padding-bottom:7px; color:var(--muted); font-size:.73rem; border-bottom:1px dashed rgba(148,160,142,.25); }
    .bag-row b { color:var(--cream); }
    .bag-empty { margin:0; color:var(--muted); font-size:.74rem; line-height:1.5; }
    .debt-control { display:grid; gap:8px; }
    .debt-control p { margin:0; color:var(--muted); font-size:.7rem; line-height:1.45; }
    .debt-control button { color:var(--rose); }
    .debt-control button:hover { background:var(--rose); border-color:var(--rose); }
    .log { display:grid; gap:6px; max-height:160px; overflow:auto; }
    .log p { margin:0; color:var(--muted); font-size:.68rem; line-height:1.42; }
    .log p:first-child { color:var(--cream); }
    .footer-actions { display:flex; justify-content:space-between; gap:10px; margin-top:12px; }
    .footer-actions button:last-child { color:var(--muted); }
    .modal { position:fixed; z-index:5; inset:0; display:grid; place-items:center; padding:20px; background:rgba(0,0,0,.68); }
    .modal.hidden { display:none; }
    .event { width:min(470px,100%); padding:20px; border:1px solid var(--amber); background:linear-gradient(145deg,#1d261d,#0a0e0b); box-shadow:0 30px 80px rgba(0,0,0,.65); }
    .event span { color:var(--amber); font-size:.69rem; font-weight:900; letter-spacing:.1em; }
    .event h2 { margin:8px 0 0; font-size:1.55rem; }
    .event p { margin:8px 0 18px; color:var(--muted); font-size:.83rem; line-height:1.55; }
    .event b { color:var(--green); }
    .end-score { display:grid; grid-template-columns:repeat(auto-fit,minmax(80px,1fr)); gap:8px; margin:16px 0; }
    .end-score div { padding:9px; background:rgba(255,255,255,.04); }
    .end-score span { display:block; color:var(--muted); font-size:.64rem; }
    .end-score b { display:block; margin-top:4px; color:var(--cream); font-size:.9rem; }
    @media (max-width:780px) { .command,.grid { grid-template-columns:1fr; } .headline { align-items:start; display:grid; } .headline p { text-align:right; } .rail { grid-template-columns:repeat(2,minmax(0,1fr)); } .rail .log-panel { grid-column:1/-1; } }
    @media (max-width:520px) { .shell { width:min(100% - 20px,1160px); padding-top:14px; } .goods,.rail { grid-template-columns:1fr; } .rail .log-panel { grid-column:auto; } .finance { min-height:72px; } .finance div { padding:9px; } .mission { min-height:76px; } .market { padding:12px; } .topbar { align-items:start; } }

    .production p { margin:4px 0 0; color:var(--muted); font-size:.75rem; line-height:1.4; }

          <section class="headline"><div><p class="eyebrow">${here.name} · ${here.zone}</p><h1>סטודנט/ית היום. במאי/ת מחר.</h1></div><p>30 שבועות לסגור חוב לימודים, לאסוף קרדיטים, ולממן את הסרט הראשון שלך.</p></section>
          <section class="command"><div class="panel mission"><i class="mission-mark"><b>✦</b></i><div><span>המסלול שלך</span><strong>${stage.name}</strong><p>${stage.copy} ${focus}</p></div></div><div class="panel finance"><div><label>מזומן</label><b>${money(state.cash)}</b></div><div class="debt"><label>חוב לימודים</label><b>${money(state.debt)}</b></div><div class="fame"><label>קרדיטים</label><b>${state.fame}</b></div><div class="followers"><label>עוקבים</label><b>${state.followers.toLocaleString("he-IL")}</b></div><div class="slots"><label>תיק הפקה</label><b>${used}/${state.capacity}</b></div></div></section>
          <section class="panel production"><div class="production-head"><div><span class="production-kicker">סלייט הפקות · ${state.films} הושלמו</span><h2>מה מצלמים עכשיו?</h2><p>כל פרויקט צורך זמן וכסף. ציוד נשאר בתיק, תסריט וימי סט נצרכים בהפקה.</p></div><div class="slate-progress">קרדיטים בדרך<b>${state.fame} / 48</b></div></div><div class="project-options">${PROJECTS.map((project) => { const missing=projectMissing(project), locked=projectUnlockCopy(project), ready=!missing.length && !locked && state.cash>=project.cost && !state.event; const requirementList=Object.entries(project.requires).map(([id,qty]) => { const have=state.bag[id]||0, isReady=have>=qty; return `<span class="${isReady ? "ready" : "missing"}">${isReady ? "✓ " : ""}${item(id).name}${qty>1 ? " ×"+qty : ""}${project.consumes[id] ? " · נצרך" : ""}</span>`; }).join(""); const status=locked || (missing.length ? "חסר: " + missing.map((entry)=>item(entry.id).name).join(" · ") : state.cash<project.cost ? "חסר " + money(project.cost-state.cash) : "מוכן לצילום"); const result=["+"+project.fame+" קרדיטים", project.reward ? "+"+money(project.reward) : "+"+project.followers+" עוקבים", project.weeks+" שבוע"+(project.weeks>1?"ות":"")].join(" · "); return `<article class="project-card ${ready ? "ready" : ""} ${locked ? "locked" : ""}"><div class="project-top"><span class="project-kind">${project.kind}</span><span class="project-weeks">${project.weeks} שבוע${project.weeks>1?"ות":""}</span></div><h3>${project.title}</h3><p>${project.copy}</p><div class="project-requirements">${requirementList}</div><div class="project-result">${result}<br>${status}</div><button data-action="project" data-id="${project.id}" ${ready ? "" : "disabled"}>${ready ? "להתחיל הפקה ←" : status}</button></article>`; }).join("")}</div></section>
          <section class="grid"><main class="panel market"><header class="market-head"><div><span class="market-kicker">הזדמנויות מקומיות · שבוע ${state.day}/30</span><h2>מה זול ב${here.name}?</h2></div><p>החץ משווה לשבוע הקודם.<br>ירוק = מחיר ירד; אדום = מחיר עלה.</p></header><div class="goods">${GOODS.map((good) => { const owned=state.bag[good.id]||0, price=state.prices[good.id], move=priceMove(good.id), arrow=move.percent>0?"▲":move.percent<0?"▼":"—"; return `<article class="good"><div><div class="good-top"><span class="good-title">${good.name}</span><span class="good-owned">בתיק: ${owned}</span></div><p class="good-note">${good.note} · ${marketSignal(good)}</p></div><div class="price-wrap"><b class="price">${money(price)}</b><span class="market-move ${move.tone}">${arrow} ${Math.abs(move.percent)}% מהשבוע שעבר</span></div><div class="deal-actions"><button data-action="buy" data-id="${good.id}" ${state.cash<price||used>=state.capacity?"disabled":""}>קנה</button><button class="sell" data-action="sell" data-id="${good.id}" ${owned?"":"disabled"}>מכור</button></div></article>`; }).join("")}</div></main>
          <aside class="rail"><section class="panel"><h2>טיסה לעיר אחרת</h2><div class="travel">${CITIES.map((place) => `<button class="${place.id===state.city?"current":""}" data-action="travel" data-id="${place.id}"><span>${place.name}<small> · ${place.zone}</small></span><b>${place.id===state.city?"כאן":""+(place.fare?money(place.fare):"חינם")}</b></button>`).join("")}</div></section>${renderJobPanel()}<section class="panel"><h2>תיק ההפקה</h2><div class="bag">${bagRows||'<p class="bag-empty">התיק ריק. מתחילים בעסקה קטנה שמאפשרת את הצילום הבא.</p>'}</div></section><section class="panel"><h2>מימון לימודים</h2><div class="debt-control"><p>בכל שבוע שעובר החוב גדל ב־0.8%. משלמים 500 ₪ כדי לקנות עוד חופש.</p><button data-action="pay">להחזיר 500 ₪</button></div></section><section class="panel log-panel"><h2>יומן הפקה</h2><div class="log">${state.log.map((line)=>`<p>› ${line}</p>`).join("")}</div></section></aside></section>
          <div class="footer-actions"><button data-action="finish">לסכם את המסלול</button><button data-action="new">מסלול חדש</button></div>
        </div>`;
        renderModal();
      }
      if (app) {
        load(); render();
        document.addEventListener("click", (event) => { const button = event.target.closest("[data-action]"); if (!button) return; const action=button.dataset.action, id=button.dataset.id; if (action==="buy") buy(id); if (action==="sell") sell(id); if (action==="travel") travel(id); if (action==="pay") payDebt(); if (action==="project") startProject(id); if (action==="job-accept") acceptJob(); if (action==="job-decline") declineJob(); if (action==="dismiss") dismissEvent(); if (action==="finish") finish(); if (action==="new") newGame(); });
      }
      globalThis.kobiNightMarket = { getState:()=>clone(state), newGame, buy, sell, travel, payDebt, produceFilm, startProject, acceptJob, declineJob, finish, dismissEvent, GOODS, CITIES, PROJECTS, JOB_TEMPLATES };
    })();
  </script>
</body>
</html>
